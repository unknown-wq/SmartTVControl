<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дровосек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fff4e0; --muted:rgba(255,244,224,.78); --good:#8fc15a; --ok:#e8b64a; --bad:#e0664a; --bg:#1f2a4a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#fff4e0; --muted:rgba(255,244,224,.78); --bg:#1f2a4a; } }
  :root[data-theme="dark"]{ --ink:#fff4e0; --muted:rgba(255,244,224,.78); --bg:#1f2a4a; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
  body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:'PT Sans',system-ui,-apple-system,'Segoe UI',sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #stage{ position:relative; width:100%; height:100%; overflow:hidden; cursor:crosshair; }
  #stage.dragging{ cursor:grabbing; }
  #stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud{ position:absolute; top:14px; left:18px; right:18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,.7); }
  .count{ font-family:'Russo One',Impact,'Arial Black',sans-serif; font-size:clamp(38px,8vw,58px); line-height:1; }
  .label{ display:block; font-family:'PT Sans',system-ui,sans-serif; font-size:15px; color:var(--muted); margin-top:4px; }
  .side{ text-align:right; font-size:17px; line-height:1.5; }
  .side b{ font-family:'Russo One',Impact,sans-serif; font-weight:400; font-size:22px; }
  .lives{ display:inline-flex; gap:6px; vertical-align:middle; margin-left:6px; }
  .lives i{ width:13px; height:13px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--ink), 0 1px 3px rgba(0,0,0,.5); }
  .lives i.used{ background:var(--bad); box-shadow:inset 0 0 0 2px var(--bad), 0 1px 3px rgba(0,0,0,.5); }
  .bottom{ position:absolute; left:0; right:0; bottom:22px; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.8); text-align:center; padding:0 16px; }
  .logname{ font-size:19px; font-weight:700; }
  .logname .knot{ color:var(--ok); }
  .hint{ font-size:15px; color:var(--muted); transition:opacity .5s; line-height:1.4; }
  [hidden]{ display:none !important; }
  .temp{ font-family:'Russo One',Impact,sans-serif; font-size:26px; line-height:1.1; margin-bottom:4px; }
  .temp.cold{ color:#a8d4ff; } .temp.hot{ color:#ffb45a; }
  .hosp b.cold{ color:#a8d4ff; } .hosp b.warm{ color:var(--good); }
  .heat .bar{ display:inline-block; width:90px; height:10px; border-radius:5px; background:rgba(255,255,255,.22); vertical-align:middle; margin-left:6px; overflow:hidden; }
  #heatBar{ display:block; height:100%; width:0; background:linear-gradient(90deg,#ffd35a,#ff5a2a); }
  .stove{ pointer-events:auto; margin-top:8px; font-family:'PT Sans',system-ui,sans-serif; font-weight:700; font-size:15px; padding:9px 14px; border:none; border-radius:10px; background:var(--ok); color:#2a1a08; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.4); text-shadow:none; }
  .stove:disabled{ opacity:.45; cursor:default; }
  .stove:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  #fade{ position:absolute; inset:0; pointer-events:none; background:#000; opacity:0; transition:opacity .8s; }
  #flash{ position:absolute; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse at 50% 55%, transparent 30%, rgba(170,0,0,.92)); transition:opacity .7s; }
  .pop{ position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); max-width:92vw; text-align:center; font-family:'Russo One',Impact,sans-serif; font-size:clamp(26px,6vw,44px); line-height:1.15; opacity:0; pointer-events:none; text-shadow:0 2px 0 rgba(40,20,5,.8), 0 4px 14px rgba(0,0,0,.6); }
  .pop.good{ color:var(--good); } .pop.ok{ color:var(--ok); } .pop.bad{ color:var(--bad); }
  .pop.show{ animation:pop .9s ease-out; }
  .pop.show.long{ animation-duration:3s; }
  @keyframes pop{
    0%{ opacity:0; transform:translate(-50%,-30%) scale(.8); }
    12%{ opacity:1; transform:translate(-50%,-50%) scale(1.05); }
    75%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-75%) scale(1); }
  }
  .over{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,12,25,.35); z-index:5; }
  .over[hidden]{ display:none; }
  .card{ position:relative; text-align:center; padding:26px 28px; max-width:26em; margin:16px; border-radius:18px; background:rgba(18,16,30,.78); box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .card h1{ font-family:'Russo One',Impact,sans-serif; font-weight:400; font-size:clamp(28px,6.5vw,48px); line-height:1.1; margin:0 0 14px; }
  .card p{ font-size:18px; line-height:1.5; color:var(--muted); margin:0 0 22px; }
  .card button{ font-family:'Russo One',Impact,sans-serif; font-size:20px; padding:14px 28px; border:none; border-radius:12px; background:var(--ok); color:#2a1a08; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .card button:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){
    .pop.show{ animation:fade .9s linear; }
    .pop.show.long{ animation-duration:3s; }
    @keyframes fade{ 0%,75%{ opacity:1; transform:translate(-50%,-50%);} 100%{ opacity:0; transform:translate(-50%,-50%);} }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="flash"></div>
  <div id="fade"></div>
  <div class="hud">
    <div class="count"><span id="pieces">0</span><span class="label">поленьев в поленнице</span></div>
    <div class="side">
      <div class="temp" id="temp"></div>
      Брёвен расколото <b id="logs">0</b><br>
      Травмы<span class="lives" id="lives"><i></i><i></i></span>
      <div id="hosp" class="hosp" hidden>Больница <b id="hospT"></b></div>
      <div id="heatRow" class="heat" hidden>Перегрев <span class="bar"><span id="heatBar"></span></span></div>
      <button id="stove" class="stove" hidden>Отнести дрова в больницу</button>
    </div>
  </div>
  <div class="pop" id="pop"></div>
  <div class="bottom">
    <div class="logname" id="kind"></div>
    <div class="hint" id="hint">Полено расколется по линии удара — любой формы, но не тоньше 4 см.<br>Проведите по экрану или нажмите ← →, чтобы обойти колоду.<br><span id="hintClimate"></span></div>
  </div>
</div>
<div class="over" id="over" hidden>
  <div class="card">
    <h1 id="overTitle">Скорая приехала</h1>
    <p id="overStats"></p>
    <button id="again">Колоть заново</button>
  </div>
</div>

<div id="errlog" style="position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:99;max-height:40vh;overflow:auto;font:12px/1.35 ui-monospace,Menlo,monospace;color:#ffd6d6;background:rgba(80,0,0,.85);border-radius:8px;padding:8px 10px;white-space:pre-wrap;display:none;pointer-events:auto"></div>
<script>
(function(){
  var box = document.getElementById('errlog');
  function log(msg){ box.style.display = 'block'; box.textContent += msg + '\n'; }
  window.addEventListener('error', function(e){
    if(e.target && e.target !== window && (e.target.src || e.target.href)) log('Не загрузился ресурс: ' + (e.target.src || e.target.href));
    else log('Ошибка: ' + e.message + (e.lineno ? ' (строка ' + e.lineno + ':' + e.colno + ')' : '') + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0,3).join('\n') : ''));
  }, true);
  window.addEventListener('unhandledrejection', function(e){ log('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
  var ce = console.error; console.error = function(){ try{ log('console.error: ' + Array.prototype.join.call(arguments,' ')); }catch(_){} ce.apply(console, arguments); };
  window.addEventListener('load', function(){ if(typeof THREE === 'undefined') log('THREE не загрузился'); });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const TAU = Math.PI*2;
const R = (a,b) => a + Math.random()*(b-a);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeInOut = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const easeOut = t => 1-Math.pow(1-t,3);
const wrap = a => { a %= TAU; if(a > Math.PI) a -= TAU; if(a < -Math.PI) a += TAU; return a; };
const wrapHalf = a => { a = wrap(a); if(a > Math.PI/2) a -= Math.PI; if(a < -Math.PI/2) a += Math.PI; return a; };
const angDist = (a,b) => Math.abs(wrap(a-b));
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const V3 = THREE.Vector3;
const Y = new V3(0,1,0);
const qAxis = (axis, a) => new THREE.Quaternion().setFromAxisAngle(axis, a);
const $ = id => document.getElementById(id);
const stage = $('stage');

/* ================= renderer ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 220);
const rig = new THREE.Group(); scene.add(rig); rig.add(camera);

function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; return t;
}
const std = o => new THREE.MeshStandardMaterial(Object.assign({ roughness:.9, metalness:0, envMapIntensity:.55 }, o));

/* ================= sky & light ================= */
const SUN_U = .05, SUN_V = .57;
const SKY = {
  mild:{ stops:[[0,'#121a38'],[.3,'#2c3160'],[.42,'#6c4f78'],[.48,'#c8757a'],[.505,'#f2a266'],[.53,'#7a5a52'],[1,'#2d2a22']], stars:260, glow:['rgba(255,225,170,.95)','rgba(255,190,120,.7)','rgba(255,150,90,0)'], r:220 },
  winter:{ stops:[[0,'#1d2a4a'],[.3,'#3c5078'],[.42,'#8a9cc0'],[.48,'#c9d2e4'],[.505,'#f3dcc4'],[.53,'#a9b0bf'],[1,'#6d7382']], stars:120, glow:['rgba(255,240,220,.9)','rgba(255,225,200,.5)','rgba(255,220,200,0)'], r:180 },
  hot:{ stops:[[0,'#27407a'],[.3,'#4b6aa8'],[.42,'#b58aa0'],[.48,'#f0b070'],[.505,'#ffd690'],[.53,'#b08a60'],[1,'#5a4a30']], stars:0, glow:['rgba(255,245,200,1)','rgba(255,210,120,.8)','rgba(255,170,90,0)'], r:320 },
};
function drawSky(x, w, h, pal){
  x.clearRect(0,0,w,h);
  const g = x.createLinearGradient(0,0,0,h);
  pal.stops.forEach(([o,c]) => g.addColorStop(o,c));
  x.fillStyle = g; x.fillRect(0,0,w,h);
  for(let i=0;i<pal.stars;i++){ x.fillStyle = `rgba(255,255,240,${R(.2,.8)})`; const s=R(.6,1.6); x.fillRect(R(0,w), R(0,h*.33), s, s); }
  for(const ux of [SUN_U*w, (SUN_U+1)*w, (SUN_U-1)*w]){
    const sy = (1-SUN_V)*h;
    const rg = x.createRadialGradient(ux,sy,0,ux,sy,pal.r);
    rg.addColorStop(0,pal.glow[0]); rg.addColorStop(.08,pal.glow[1]); rg.addColorStop(1,pal.glow[2]);
    x.fillStyle = rg; x.fillRect(ux-pal.r-10, sy-pal.r-10, 2*pal.r+20, 2*pal.r+20);
    x.fillStyle = '#fff3da'; x.beginPath(); x.arc(ux, sy, 9, 0, TAU); x.fill();
  }
}
const skyTex = canvasTex(1024, 512, (x,w,h) => drawSky(x,w,h,SKY.mild));
const skyMat = new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide, fog:false, depthWrite:false });
const sky = new THREE.Mesh(new THREE.SphereGeometry(180,64,32), skyMat);
sky.renderOrder = -1; scene.add(sky);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16), skyMat));
let envRT = null;
function rebuildEnv(){ if(envRT) envRT.dispose(); envRT = pmrem.fromScene(envScene, .04); scene.environment = envRT.texture; }
rebuildEnv();
scene.fog = new THREE.Fog(0x6e5468, 12, 46);

const hemi = new THREE.HemisphereLight(0xaab6ff, 0x3d3020, .45); scene.add(hemi);
const sunDir = (() => { const phi = SUN_U*TAU, th = (1-SUN_V)*Math.PI; return new V3(-Math.cos(phi)*Math.sin(th), Math.cos(th), Math.sin(phi)*Math.sin(th)); })();
const sun = new THREE.DirectionalLight(0xffc28a, 1.25);
sun.position.copy(sunDir).multiplyScalar(14).setY(Math.max(3.5, sunDir.y*14));
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, { left:-7, right:7, top:7, bottom:-7, near:1, far:40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const lamp = new THREE.PointLight(0xffa24a, 1.0, 7, 2);
lamp.position.set(1.8, .55, 1.7); scene.add(lamp);

/* ================= ground & grass ================= */
function drawGround(x,w,h,cl){
  x.clearRect(0,0,w,h);
  if(cl === 'winter'){
    x.fillStyle = '#dde4ee'; x.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){ x.fillStyle = Math.random()<.6 ? `rgba(255,255,255,${R(.2,.5)})` : `rgba(160,176,200,${R(.1,.25)})`; x.beginPath(); x.arc(R(0,w),R(0,h),R(3,26),0,TAU); x.fill(); }
    for(let i=0;i<500;i++){ x.fillStyle = 'rgba(90,100,110,.25)'; x.fillRect(R(0,w),R(0,h),1.2,R(1,3)); }
    return;
  }
  const hot = cl === 'hot';
  x.fillStyle = hot ? '#6d6a3a' : '#4c5732'; x.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){
    const c = hot ? (Math.random()<.6 ? `rgba(${R(140,175)|0},${R(125,150)|0},${R(60,85)|0},${R(.15,.35)})` : `rgba(${R(100,125)|0},${R(80,95)|0},${R(45,60)|0},${R(.12,.3)})`)
                  : (Math.random()<.6 ? `rgba(${R(60,95)|0},${R(90,120)|0},${R(35,55)|0},${R(.15,.35)})` : `rgba(${R(80,110)|0},${R(65,85)|0},${R(40,55)|0},${R(.12,.3)})`);
    x.fillStyle = c; x.beginPath(); x.arc(R(0,w),R(0,h),R(3,26),0,TAU); x.fill();
  }
  for(let i=0;i<3000;i++){ x.fillStyle = hot ? 'rgba(80,65,35,.3)' : `rgba(${R(20,50)|0},${R(35,60)|0},${R(15,30)|0},.35)`; x.fillRect(R(0,w),R(0,h),1.5,R(2,5)); }
}
const groundTex = canvasTex(512,512,(x,w,h)=>drawGround(x,w,h,'mild'));
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(26,26);
const ground = new THREE.Mesh(new THREE.CircleGeometry(80,72), std({ map:groundTex, bumpMap:groundTex, bumpScale:.03 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function drawDirt(x,w,h,cl){
  x.globalCompositeOperation = 'source-over'; x.clearRect(0,0,w,h);
  x.fillStyle = cl==='winter' ? '#9a968f' : cl==='hot' ? '#7a6242' : '#5e4a30'; x.fillRect(0,0,w,h);
  for(let i=0;i<1200;i++){
    x.fillStyle = cl==='winter' ? `rgba(${R(200,240)|0},${R(205,240)|0},${R(215,250)|0},${R(.2,.5)})` : `rgba(${R(60,120)|0},${R(45,85)|0},${R(25,50)|0},${R(.2,.5)})`;
    x.beginPath(); x.arc(R(0,w),R(0,h),R(1,6),0,TAU); x.fill();
  }
  x.globalCompositeOperation = 'destination-in';
  const rg = x.createRadialGradient(w/2,h/2,w*.18,w/2,h/2,w/2);
  rg.addColorStop(0,'rgba(0,0,0,1)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle = rg; x.fillRect(0,0,w,h);
  x.globalCompositeOperation = 'source-over';
}
const dirtTex = canvasTex(512,512,(x,w,h)=>drawDirt(x,w,h,'mild'));
const dirt = new THREE.Mesh(new THREE.CircleGeometry(2.3,64), std({ map:dirtTex, transparent:true, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-1 }));
dirt.rotation.x = -Math.PI/2; dirt.position.y = .004; dirt.receiveShadow = true; scene.add(dirt);

function bladeGeometry(){
  const segs = 4, pos = [], col = [], idx = [];
  for(let i=0;i<=segs;i++){
    const t = i/segs, hw = .02*(1-t*.92), z = t*t*.13;
    pos.push(-hw,t,z, hw,t,z);
    const c = .32 + .68*t; col.push(c,c,c, c,c,c);
  }
  for(let i=0;i<segs;i++){ const a = i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const GRASS_N = 13000;
let grass;
{
  const N = GRASS_N;
  grass = new THREE.InstancedMesh(bladeGeometry(), new THREE.MeshStandardMaterial({ vertexColors:true, side:THREE.DoubleSide, roughness:.85, envMapIntensity:.3 }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new V3(), s = new V3(), col = new THREE.Color();
  let n = 0;
  while(n < N){
    const r = .9 + Math.pow(Math.random(),1.5)*17, a = R(0,TAU);
    if(r < 2.1 && Math.random() > (r-.9)/1.2) continue;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(x > -4.7 && x < -.5 && z > -4.1 && z < -1.9 && Math.random() < .8) continue;
    p.set(x,0,z);
    q.setFromEuler(new THREE.Euler(R(-.25,.25), R(0,TAU), R(-.25,.25)));
    s.set(R(.8,1.6), R(.16,.46), 1);
    m.compose(p,q,s); grass.setMatrixAt(n, m);
    col.setHSL(R(.19,.29), R(.35,.55), R(.24,.4)); grass.setColorAt(n, col);
    n++;
  }
  grass.receiveShadow = true; scene.add(grass);
}

/* ================= wood textures & species ================= */
function endGrain(base, ring, cuts){
  return canvasTex(512,512,(x,w,h)=>{
    x.fillStyle = base; x.fillRect(0,0,w,h);
    const cx = w/2+R(-14,14), cy = h/2+R(-14,14);
    let r = 6;
    while(r < 228){
      x.strokeStyle = `rgba(${ring},${R(.22,.55)})`; x.lineWidth = R(1.5,4.5);
      x.beginPath(); x.ellipse(cx,cy,r,r*R(.96,1.03),R(0,1),0,TAU); x.stroke(); r += R(7,17);
    }
    for(let i=0;i<500;i++){ x.fillStyle = `rgba(${ring},${R(.05,.15)})`; x.fillRect(R(0,w),R(0,h),R(1,3),R(1,3)); }
    x.fillStyle = `rgb(${ring})`; x.beginPath(); x.arc(cx,cy,5,0,TAU); x.fill();
    x.strokeStyle = `rgba(${ring},.6)`; x.lineWidth = 2.5;
    for(let i=0;i<3;i++){ const a=R(0,TAU), a0=R(16,60), a1=R(110,210);
      x.beginPath(); x.moveTo(cx+Math.cos(a)*a0, cy+Math.sin(a)*a0); x.lineTo(cx+Math.cos(a)*a1, cy+Math.sin(a)*a1); x.stroke(); }
    if(cuts){
      x.strokeStyle='rgba(60,35,15,.5)';
      for(let i=0;i<18;i++){ x.lineWidth=R(2,6); const a=R(-.6,.6)+(i%2?Math.PI/2:0), px=R(80,432), py=R(80,432), l=R(50,130);
        x.beginPath(); x.moveTo(px-Math.cos(a)*l,py-Math.sin(a)*l); x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l); x.stroke(); }
    }
    x.strokeStyle = '#3e2a1b'; x.lineWidth = 22; x.beginPath(); x.arc(w/2,h/2,w/2-11,0,TAU); x.stroke();
  });
}
function innerGrain(base, line){
  return canvasTex(512,512,(x,w,h)=>{
    x.fillStyle = base; x.fillRect(0,0,w,h);

  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);

  const f = flatFit(s.poly);
  const before = { stack:PILE.stack, rowBase:PILE.rowBase, rowX:PILE.rowX, rowH:PILE.rowH };
  if(PILE.rowX + f.w > PILE.x1 && PILE.rowX > PILE.x0){ PILE.rowBase += PILE.rowH + .01; PILE.rowX = PILE.x0; PILE.rowH = 0; }

    PILE.stacks[PILE.stack].forEach(o => { scene.remove(o.g); const k = pileItems.indexOf(o); if(k >= 0) pileItems.splice(k,1); if(o.landed) pileCount--; });
    PILE.stacks[PILE.stack] = [];

    const sa = (Q.x-P.x)*n.x + (Q.z-P.z)*n.z, sb = (S.x-P.x)*n.x + (S.z-P.z)*n.z;
    if((sa >= 0) !== (sb >= 0)){

      const tt = (ix-P.x)*d.x + (iz-P.z)*d.z; tmin = Math.min(tmin,tt); tmax = Math.max(tmax,tt);
    }

  if(tmin > tmax || tmax < 1-.13 || tmin > 1+.13) return { cls:'block' };
  const nn = { x:-n.x, z:-n.z };

function segmentBlocked(a, b){
  const boxes = [PILE_BOX, WAIT_BOX, { x0:-1.2, x1:1.2, z0:-1.2, z1:1.2 }, { x0:1.3, x1:2.3, z0:1.2, z1:2.2 }];

    const x = lerp(a.x,b.x,t), z = lerp(a.z,b.z,t);
    for(const bx of boxes) if(x > bx.x0-1.3 && x < bx.x1+1.3 && z > bx.z0-1.3 && z < bx.z1+1.3) hits++;
  }

}
function startFall(){

function poseMedic(m, pos, face, stretcherC, walking, dist){
  m.g.position.copy(pos);
  m.g.lookAt(pos.x + face.x, 0, pos.z + face.z);
  if(m.last) m.phase += m.g.position.distanceTo(m.last)*6.5;
  m.last = pos.clone();
  const sw = walking ? Math.sin(m.phase)*.5 : 0;
  m.legs[0].rotation.x = sw; m.legs[1].rotation.x = -sw;
  const toStr = new V3().subVectors(stretcherC, pos);
  const fwd = toStr.dot(face) > 0;
  m.arms.forEach(a => { a.rotation.x = fwd ? -1.0 : .55; a.rotation.z = 0; });
}
function updateRescue(T){
  const door = amb.door;
  const open = clamp((T-.2)/.6,0,1), close = clamp((T-7.7)/.4,0,1);
  door.position.z = lerp(.55, -.45, easeInOut(open) - easeInOut(close));
  door.position.x = 1.03 + .05*Math.min(1, open*4)*(1-close);
  if(T >= .8 && !res) spawnRescue();
  if(!res) return;
  const { D, E, inside, u } = res;
  let center, face, walking;
  if(T < 3.0){ const k = easeInOut(clamp((T-.8)/2.2,0,1)); center = D.clone().lerp(E,k); face = u.clone(); walking = k < 1; }
  else if(T < 4.6){ center = E.clone(); face = null; walking = false; }
  else if(T < 6.8){ const k = easeInOut(clamp((T-4.6)/2.2,0,1)); center = E.clone().lerp(D,k); face = u.clone().negate(); walking = k < 1; }
  else { const k = clamp((T-6.8)/.9,0,1); center = D.clone().lerp(inside,k); face = new V3().subVectors(inside, D).normalize(); walking = true; }
  res.str.position.copy(center);
  res.str.lookAt(center.x + u.x, 0, center.z + u.z);
  const pA = center.clone().addScaledVector(u,-1.35), pB = center.clone().addScaledVector(u,1.35);
  poseMedic(res.medics[0], pA, face || u, center, walking);
  poseMedic(res.medics[1], pB, face || u.clone().negate(), center, walking);
  if(T >= 3.2){
    const k = easeInOut(clamp((T-3.2)/1.2,0,1));
    const lie = center.clone().addScaledVector(u,.62).setY(1.03);

}

  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = camera.aspect < .8 ? 82 : 70;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ================= weather, hospital heating ================= */
const HOSP_WARM = 12, HOSP_MAX = 26, HOSP_PER = 2;
let tempOut = 10, climate = 'mild', hospH = 20, burned = 0, tripDone = false;
function newWeather(){
  tempOut = Math.round(R(-50, 50));
  climate = tempOut < 0 ? 'winter' : tempOut >= 30 ? 'hot' : 'mild';
  hospH = 20; burned = 0; heat = 0;
  drawSky(skyTex.image.getContext('2d'), 1024, 512, SKY[climate]); skyTex.needsUpdate = true; rebuildEnv();
  drawGround(groundTex.image.getContext('2d'), 512, 512, climate); groundTex.needsUpdate = true;
  drawDirt(dirtTex.image.getContext('2d'), 512, 512, climate); dirtTex.needsUpdate = true;
  const W = climate === 'winter', H = climate === 'hot';
  scene.fog.color.setHex(W ? 0xb3bccb : H ? 0x9c7c64 : 0x6e5468); scene.fog.near = W ? 8 : 12; scene.fog.far = W ? 38 : H ? 52 : 46;
  hemi.color.setHex(W ? 0xd6e2ff : H ? 0xffe2b0 : 0xaab6ff); hemi.groundColor.setHex(W ? 0xb8c0cc : H ? 0x5a4a2a : 0x3d3020); hemi.intensity = W ? .6 : H ? .55 : .45;
  sun.color.setHex(W ? 0xffe4c8 : H ? 0xffd49a : 0xffc28a); sun.intensity = W ? .95 : H ? 1.6 : 1.25;
  grass.visible = !W;
  const col = new THREE.Color();
  for(let i=0;i<GRASS_N;i++){ H ? col.setHSL(R(.1,.17), R(.35,.5), R(.3,.45)) : col.setHSL(R(.19,.29), R(.35,.55), R(.24,.4)); grass.setColorAt(i, col); }
  grass.instanceColor.needsUpdate = true;
  snowCaps.forEach(c => c.visible = W);
  hosp.roofMat.color.setHex(W ? 0xeef2f6 : 0x3f6b4c);
  snow.visible = W; snowGeo.setDrawRange(0, Math.round(SNOW_N*clamp(-tempOut/35, .2, 1)));
  const te = $('temp');
  te.textContent = (W ? 'Мороз ' : H ? 'Жара ' : '') + fmtT(tempOut);
  te.className = 'temp' + (W ? ' cold' : H ? ' hot' : '');
  $('hosp').hidden = !W; $('stove').hidden = !W; $('heatRow').hidden = !H;
  $('hintClimate').textContent = W
    ? `Больница топится вашими дровами: в минуту сгорает 1 полено за каждые 10° мороза (сейчас ${(Math.abs(tempOut)/10).toFixed(1).replace('.',',')}), полено даёт +2°C. Ниже +12°C лечить не смогут.`
    : H ? 'В жару не рубите часто: при перегреве можно получить солнечный удар.' : '';
  setTimeout(() => popup(W ? `Мороз ${fmtT(tempOut)}. Больница топится вашими дровами` : H ? `Жара ${fmtT(tempOut)}. Не спешите` : `${fmtT(tempOut)}, отличная погода для дров`, W ? 'bad' : H ? 'ok' : 'good', true), 300);
}
let hudCache = '';
function updateWeather(dt, t){
  const W = climate === 'winter';
  if(W) hospH = Math.max(tempOut, hospH - dt*Math.abs(tempOut)/300);
  if(climate === 'hot') heat = Math.max(0, heat - dt/(1.3 + (tempOut-30)*.06));
  const warmth = W ? clamp((hospH-4)/16, 0, 1) : 1;
  hosp.winMat.emissive.setRGB(lerp(.25,1,warmth), lerp(.35,.69,warmth), lerp(.5,.38,warmth));
  hosp.winMat.emissiveIntensity = lerp(.25, 1.3, warmth);
  hosp.lamp.intensity = warmth*1.1;
  smokeT -= dt;
  if(smokeT <= 0){
    smokeT = (W ? lerp(1.6, .14, warmth) : .9)*R(.7,1.3);
    const sp = smoke.find(q => !q.on);
    if(sp){ sp.on = true; sp.life = 0; sp.max = R(4,6); sp.m.visible = true; sp.m.position.copy(hosp.chimney); sp.a = W ? .35 + .4*warmth : .35; }
  }
  for(const sp of smoke){
    if(!sp.on) continue;
    sp.life += dt;
    sp.m.position.y += dt*.7; sp.m.position.x += dt*.35;
    sp.m.scale.setScalar(.6 + sp.life*.55);
    sp.m.material.opacity = Math.max(0, 1 - sp.life/sp.max)*sp.a;
    if(sp.life >= sp.max){ sp.on = false; sp.m.visible = false; }
  }
  if(snow.visible){
    const a = snowGeo.attributes.position.array, n = snowGeo.drawRange.count, wind = Math.min(1.5, -tempOut/30);
    for(let i=0;i<n;i++){
      a[i*3+1] -= dt*(.8 + (i%7)*.09);
      a[i*3] += dt*(Math.sin(t*.7 + i)*.25 + wind*.3);
      if(a[i*3+1] < 0) a[i*3+1] += 12;
      if(a[i*3] > 14) a[i*3] -= 28;
    }
    snowGeo.attributes.position.needsUpdate = true;
    camera.getWorldPosition(tmpV); snow.position.set(tmpV.x, 0, tmpV.z);
  }
  const key = W ? Math.round(hospH) + '|' + pileCount + '|' + state : climate==='hot' ? (heat*20|0) + '' : '';
  if(key !== hudCache){
    hudCache = key;
    if(W){
      const b = $('hospT'); b.textContent = fmtT(hospH); b.className = hospH >= HOSP_WARM ? 'warm' : 'cold';
      $('stove').disabled = !(state === 'idle' && pileCount > 0 && hospH < HOSP_MAX - 1 && !gameOver);
    }
    if(climate === 'hot'){ const hb = $('heatBar'); hb.style.width = Math.min(100, heat/5*100) + '%'; }
  }
}
$('stove').addEventListener('click', e => {
  e.stopPropagation();
  if(state !== 'idle' || gameOver || pileCount === 0) return;
  if(pileItems.length && !pileItems[pileItems.length-1].landed){ popup('Подождите, полено ещё летит','ok'); return; }
  audio(); state = 'trip'; st = 0; tripDone = false; marker.visible = false;
  fadeEl.style.opacity = 1;
  popup('Несёте дрова в больницу…','ok');
});

/* ================= loop ================= */
const clock = new THREE.Clock();
const tmpV = new V3(), tmpQ = new THREE.Quaternion(), lookW = new V3();
let idleT = 0;
function tick(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  // rotate around the block
  if(canRotate()) yawTarget += ((keys.left?1:0) - (keys.right?1:0))*dt*1.7;
  if(state === 'idle') rig.rotation.y += (yawTarget - rig.rotation.y)*Math.min(1, dt*10);
  rig.updateMatrixWorld(true);

  // feed the block
  const waitingMoving = WAIT_SLOTS.some(w=>w.item && !w.item.ready);
  if(!gameOver && state!=='down' && !cur && !blockIncoming && flyers.length===0 && !waitingMoving){
    idleT += dt;
    if(idleT > .3){ idleT = 0; if(!takeWaiting()) spawnLog(); }
  } else idleT = 0;

  if(cur){
    if(cur.falling){
      cur.vy -= 14*dt; cur.g.position.y += cur.vy*dt;
      if(cur.g.position.y <= cur.rest){ cur.g.position.y = cur.rest; cur.falling = false; sfx.land(); shake = Math.max(shake,.025); }
    }
    if(cur.wiggle > 0){
      cur.wiggle -= dt;
      const amp = cur.wiggle > 0 ? Math.sin(t*60)*.03*(cur.wiggle/.3) : 0;
      cur.g.quaternion.copy(qAxis(new V3(0,0,1), amp)).multiply(cur.baseQ);
    }
  }

  if(hoverX !== null && cur && !cur.falling && state==='idle'){
    marker.visible = true; marker.position.set(clamp(hoverX,-.75,.75), topY()+.004, 0);
  } else marker.visible = false;

  switch(state){
    case 'idle': {
      const tx = hoverX !== null ? clamp(hoverX,-.75,.75) : (cur && !cur.falling ? clamp(pieceExtent(cur).cx,-.75,.75) : 0);
      axe.position.x += (tx - axe.position.x)*Math.min(1, dt*10);
      axeTh += (IDLE + Math.sin(t*1.8)*.04 - axeTh)*Math.min(1, dt*8); axe.rotation.z = 0; break; }
    case 'windup': {
      st += dt; const k = Math.min(1, st/.13);
      axeTh = lerp(thFrom, WIND, easeOut(k)); axe.position.x = lerp(xFrom, aimX, easeOut(k));
      if(k >= 1){ state='strike'; st=0; strikeTh = angleFor(hitClass==='block' ? STUMP_TOP - .01 : topY() - .05); sfx.whoosh(); }
      break; }
    case 'strike': {
      st += dt; const k = Math.min(1, st/.11); axeTh = lerp(WIND, strikeTh, k*k*k);
      if(k >= 1){ resolveHit(); state='impact'; st=0; }
      break; }
    case 'impact':
      st += dt;
      if(result==='split') axeTh = lerp(strikeTh, deepTh, Math.min(1, st/.06));
      if(result==='glance'){ const k=Math.min(1,st/.24); axeTh = strikeTh + Math.sin(k*Math.PI)*.35; axe.rotation.z = Math.sin(st*45)*.12*(1-k); }
      if(st > .24){
        if(hurtPending){ hurtPending=false; state='down'; st=0; thFrom=axeTh; sfx.ouch(); shake=.3; flash(.55); startFall(); }
        else { state='return'; st=0; thFrom=axeTh; }
      }
      break;
    case 'return': {
      st += dt; const k = Math.min(1, st/.35); axeTh = lerp(thFrom, IDLE, easeInOut(k)); axe.rotation.z *= .8;
      if(k >= 1) state='idle';
      break; }
    case 'trip': {
      st += dt;
      if(st > .85 && !tripDone){
        tripDone = true;
        const want = Math.max(1, Math.ceil((HOSP_MAX - hospH)/HOSP_PER));
        const n = removeFromPile(want);
        hospH = Math.min(HOSP_MAX, hospH + n*HOSP_PER); burned += n;
        popup(`Сожгли ${n} ${plural(n,'полено','полена','поленьев')}. В больнице ${fmtT(hospH)}`, 'good', true);
        for(let i=0;i<Math.min(n,5);i++) setTimeout(sfx.stack, i*120);
      }
      if(st > 2.1) fadeEl.style.opacity = 0;
      if(st > 2.6){ state = 'idle'; st = 0; }
      break; }
    case 'down': {
      st += dt;
      const k = easeInOut(Math.min(1, st/.8));
      axeTh = lerp(thFrom, -2.1, Math.min(1, st/.4)); axe.position.y = PIVOT_Y - .5*Math.min(1, st/.4);
      if(st > .45){ axe.visible = false; arms.forEach(a=>a.visible=false); }
      if(!res || st - 1.3 - (amb ? amb.dur : 0) < 3.2){
        camLocal.lerpVectors(CAM_STAND, fall.pos, k);
        lookLocal.lerpVectors(LOOK_STAND, fall.look, k);
        roll = -fall.side*1.2*k;
      }
      if(st > .78 && !fall.thud){ fall.thud = true; sfx.thud(); shake = .12; }
      if(st > 1.3 && !fall.ambStarted){ fall.ambStarted = true; startAmbulance(); }
      if(amb && amb.t >= amb.dur) updateRescue(st - 1.3 - amb.dur);
      break; }
  }
  axe.rotation.x = axeTh;
  updateWeather(dt, t);
  updateArms();
  updateAmbulance(dt, t);

  for(let i=flyers.length-1;i>=0;i--){
    const f = flyers[i]; f.t += dt;
    f.v.y -= 9.8*dt; f.g.position.addScaledVector(f.v, dt);
    f.g.quaternion.premultiply(tmpQ.setFromAxisAngle(f.axis, f.w*dt));
    if(f.t > .38){ flyers.splice(i,1); route(f.g, f.s); }
  }
  for(let i=tweens.length-1;i>=0;i--){
    const tw = tweens[i]; tw.t += dt;
    const k = Math.min(1, tw.t/tw.dur), e = easeInOut(k);
    tw.g.position.lerpVectors(tw.fromP, tw.toP, e); tw.g.position.y += Math.sin(k*Math.PI)*tw.arc;
    tw.g.quaternion.copy(tw.fromQ).slerp(tw.toQ, e);
    if(k >= 1){ tweens.splice(i,1); tw.done && tw.done(); }
  }
  for(let i=chips.length-1;i>=0;i--){
    const c = chips[i]; c.life -= dt;
    c.v.y -= 9.8*dt; c.m.position.addScaledVector(c.v, dt);
    const floor = (Math.hypot(c.m.position.x, c.m.position.z) < .62 ? STUMP_TOP : 0) + .01;
    if(c.m.position.y < floor){ c.m.position.y = floor; c.v.set(c.v.x*.3, 0, c.v.z*.3); c.s.multiplyScalar(.3); }
    c.m.rotation.x += c.s.x*dt; c.m.rotation.y += c.s.y*dt; c.m.rotation.z += c.s.z*dt;
    if(c.life < .3) c.m.scale.multiplyScalar(Math.max(0, 1 - dt*6));
    if(c.life <= 0){ scene.remove(c.m); chips.splice(i,1); }
  }

  lamp.intensity = .95 + Math.sin(t*7)*.05 + Math.sin(t*13)*.04;
  shake = Math.max(0, shake - dt*.6);
  const sm = shake * (reduceMotion ? .25 : 1);
  camera.position.copy(camLocal).add(tmpV.set(R(-sm,sm), R(-sm,sm), R(-sm,sm)));
  lookW.copy(lookLocal);
  if(state==='idle' && hoverX!==null) lookW.x += hoverX*.12;
  rig.localToWorld(lookW);
  camera.lookAt(lookW); camera.rotateZ(roll);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
newWeather();
tick();
})();
</script>
</body>
</html>
