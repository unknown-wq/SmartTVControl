/* ---- 11_powers.js ---- */
/* =====================================================================
 * 11_powers.js — Powers: every god tool in ToolDefs + the persistent effects in S.eff
 * OWNER: Powers agent. API: docs/CONTRACT.md §3 Powers.   DOM-free (runs headless in node).
 *
 *  - Powers.apply(toolId, tx, ty, radius, phase) -> boolean   handles EVERY ToolDefs id (terrain brushes, creatures, erase,
 *    lightning, meteor, fire, earthquake, plague, tornado, rain, heal, bless, war_whisper, peace, split, inspect).
 *    `phase`: 'tap' | 'start' | 'move' | 'end'. Non-drag tools act on tap/start only; drag tools are rate-limited on 'move'
 *    (a move acts only after the finger travelled >= 0.5 tile or 3 ticks passed; brushes fill the gap with interpolated stamps).
 *    Returns true when the power took effect, false when it was throttled / had no target / failed.
 *    Powers.lastMessage = short Russian text about the last apply() (success text, or the reason of a failure for a toast);
 *    '' when the call was silently ignored (throttled move, 'end', move of a non-drag tool).
 *  - Powers.pick(tx, ty) -> {type:'unit'|'building'|'city'|'tile', id, x, y} | null (null = outside the map).
 *  - Persistent effects live in S.eff (JSON-safe, saved with the world), advanced by Powers.step(tick):
 *      meteors [{x,y,r,eta,t0}]   tornados [{x,y,dx,dy,until,r, nt}]   rains [{x,y,r,until}]   quakes [{x,y,r,until, t0,b,n,m,h}]
 *    (extra fields are private to this module; Render only reads x,y,r,eta,t0).
 *  - Private non-persistent state: the drag throttle (cleared on newWorld/afterLoad). All randomness goes through R.
 * ===================================================================== */

const Powers = (() => {
  const T = Const.T, RES = Const.RES, LOG = Const.LOG, TAU = Math.PI * 2;

  // ------------------------------------------------------------------ tunables
  const METEOR_DELAY = 8, METEOR_CAP = 8;
  const TORNADO_LIFE = 450, TORNADO_CAP = 3, TORNADO_R = 2;
  const RAIN_LIFE = 200, RAIN_CAP = 12;
  const QUAKE_LIFE = 30, QUAKE_CAP = 4;
  const BLESS_TICKS = 900, BLESS_MUL = 1.4;
  const PLAGUE_P = 0.6;
  const MAX_STAMPS = 6;

  // ------------------------------------------------------------------ private runtime state (non-persistent)
  const drag = { tool: '', x: 0, y: 0, tick: -999, sx: 0, sy: 0, st: -999, n: 0 };
  let lastMessage = '';
  let errCount = 0, lastError = null;
  const buf = [];                                   // scratch list of units (tornado)
  const stX = new Float64Array(MAX_STAMPS), stY = new Float64Array(MAX_STAMPS);
  function pushBuf(u) { buf.push(u); }

  // ------------------------------------------------------------------ helpers
  function num(v, d) { return (typeof v === 'number' && v === v && v > -1e7 && v < 1e7) ? v : d; }
  function rInt(r, lo, hi, d) { r = Math.round(num(r, d)); return r < lo ? lo : r > hi ? hi : r; }
  function inMap(x, y) { return x >= 0 && y >= 0 && x < S.w && y < S.h; }
  function msg(text, ok) { lastMessage = text; return ok; }
  function report(e, where) {
    errCount++; lastError = e;
    if (errCount <= 5 && typeof console !== 'undefined') console.error('Powers ' + where + ':', e && e.stack || e);
  }
  function inRad(x, y, r) {
    const a = Units.inRadius(x, y, r);
    return Array.isArray(a) ? a : [];
  }
  function alive(u) { return !!u && S.units.get(u.id) === u; }
  function fx(type, x, y, o) { return Fx.add(type, x, y, o); }
  function eff() {
    let e = S.eff;
    if (!e || typeof e !== 'object') e = S.eff = {};
    if (!Array.isArray(e.meteors)) e.meteors = [];
    if (!Array.isArray(e.tornados)) e.tornados = [];
    if (!Array.isArray(e.rains)) e.rains = [];
    if (!Array.isArray(e.quakes)) e.quakes = [];
    return e;
  }
  function isWaterT(t) { return t === T.DEEP || t === T.SHALLOW; }
  function nearestCity(x, y, maxD) {
    let best = null, bd = maxD * maxD;
    for (const c of S.cities.values()) {
      const dx = c.x + 0.5 - x, dy = c.y + 0.5 - y, d = dx * dx + dy * dy;
      if (d <= bd) { bd = d; best = c; }
    }
    return best;
  }
  /** chance that a brush of fire / lightning sets this tile alight (World.ignite has the final word on flammability) */
  function burnChance(i, grassP) {
    if (S.bld[i]) return 0.8;
    const t = S.tile[i], rk = S.res[i];
    if (t === T.FOREST) return 0.85;
    if (rk === RES.TREE) return 0.8;
    if (rk === RES.BERRY) return 0.5;
    if (t === T.GRASS) return grassP || 0.45;
    if (t === T.HILL) return 0.12;
    return 0;
  }
  /** points of a stroke between the previous and the current finger position (fills stX/stY, returns the count) */
  function plan(x0, y0, x1, y1, spacing) {
    const dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx * dx + dy * dy);
    let n = Math.ceil(len / spacing);
    if (n < 1) n = 1; else if (n > MAX_STAMPS) n = MAX_STAMPS;
    for (let k = 1; k <= n; k++) { const t = k / n; stX[k - 1] = x0 + dx * t; stY[k - 1] = y0 + dy * t; }
    return n;
  }
  function removeBuilding(x, y, cause) {
    const id = S.bld[y * S.w + x];
    if (!id) return false;
    return Buildings.destroyAt(x, y, cause) === true;
  }

  // ------------------------------------------------------------------ terrain brushes
  const TFX = { raise: '#a88a5c', lower: '#7a6444', grass: '#6fbf4a', sand: '#e6d49a', forest: '#3d8a3a', hill: '#9a8a5a', mountain: '#8a8688', snow: '#f2f7ff' };
  function fxTerrain(id, x, y, r) {
    if (id === 'lava') {
      fx('smoke', x, y, { ttl: 0.9 });
      fx('fire', x, y, { ttl: 0.6 });
      return;
    }
    fx('dust', x, y, { ttl: 0.55, color: TFX[id] });
    if (r >= 3) fx('dust', x + R.between(-r, r) * 0.6, y + R.between(-r, r) * 0.6, { ttl: 0.5, color: TFX[id] });
  }
  function brushAt(id, x, y, r) {
    const n = World.brush(id, x, y, r);
    return typeof n === 'number' && n === n ? n : 0;
  }
  function terrainTool(id, x, y, r, first, lx, ly) {
    let changed = 0;
    if (first) {
      changed = brushAt(id, x, y, r);
      fxTerrain(id, x, y, r);
    } else {
      const n = plan(lx, ly, x, y, Math.max(1, r * 0.8));
      for (let k = 0; k < n; k++) changed += brushAt(id, stX[k], stY[k], r);
      if ((drag.n++ & 1) === 0) fxTerrain(id, x, y, r);
    }
    return msg(changed > 0 ? 'Ландшафт изменён' : 'Ничего не изменилось', changed > 0);
  }

  // ------------------------------------------------------------------ creatures / erase
  const RACE_OF = { human: Const.RACE.HUMAN, orc: Const.RACE.ORC, elf: Const.RACE.ELF };
  function creatureTool(id, x, y, r, first) {
    let count;
    if (first) {
      count = Math.round(Math.PI * r * r / 2);
      if (count < 1) count = 1; else if (count > 6) count = 6;
    } else {
      // drag: one creature per 4 ticks (or per 2 tiles of travel when the clock is paused)
      if (S.tick - drag.st < 4 && Util.dist(x, y, drag.sx, drag.sy) < 2) return false;
      count = 1;
    }
    const race = RACE_OF[id];
    const rad = r + 0.25;
    let made = 0, tries = 0;
    while (made < count && tries < count * 14) {
      tries++;
      const a = R.f() * TAU, d = Math.sqrt(R.f()) * rad;
      const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
      if (!inMap(px, py)) continue;
      const pi = (py | 0) * S.w + (px | 0), t = S.tile[pi];
      if (!Tiles.isLand(t) || S.fire[pi]) continue;
      const u = Units.spawn(race, px, py, {});
      if (!u) { if (S.units.size >= (S.perf.unitCap || Const.MAX_UNITS)) break; continue; }
      made++;
      fx('spark', px, py, { ttl: 0.6, n: 6 });
    }
    drag.st = S.tick; drag.sx = x; drag.sy = y;
    if (made > 0) return msg('Создано: ' + made, true);
    const capped = S.units.size >= (S.perf.unitCap || Const.MAX_UNITS);
    return msg(capped ? 'Достигнут предел населения' : 'Здесь нельзя создать существ', false);
  }

  function eraseTool(x, y, r, first, lx, ly) {
    let n = 0;
    const pts = first ? 1 : plan(lx, ly, x, y, Math.max(1, r * 0.8));
    for (let k = 0; k < pts; k++) {
      const px = first ? x : stX[k], py = first ? y : stY[k];
      const list = inRad(px, py, r + 0.5);
      for (let i = 0; i < list.length; i++) {
        if (i < 6) fx('blood', list[i].x, list[i].y, { ttl: 0.5 });
      }
      const c = Units.eraseInRadius(px, py, r + 0.5);
      if (typeof c === 'number') n += c;
    }
    return msg(n > 0 ? 'Стёрто существ: ' + n : 'Тут никого нет', n > 0);
  }

  // ------------------------------------------------------------------ lightning
  function lightning(x, y) {
    x = num(x, NaN); y = num(y, NaN);
    if (!(x === x) || !(y === y) || !S.tile || !inMap(x, y)) return msg('Вне карты', false);
    const tx = x | 0, ty = y | 0, w = S.w, i0 = ty * w + tx;
    const water = isWaterT(S.tile[i0]);
    fx('lightning', x, y, { ttl: 0.75 });
    fx('explosion', x, y, { ttl: 0.55, r: 1.2 });
    fx('spark', x, y, { ttl: 0.7, n: 10 });
    fx('quake', x, y, { ttl: 0.35, r: 1, shake: 0.25 });
    if (water) fx('splash', x, y, { ttl: 0.7 });
    // creatures (rulers' deaths are logged by Units itself)
    let killed = 0;
    const list = inRad(x, y, 1.2);
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      if (Units.damage(u, 40, 'lightning') === true) killed++;
      else if (alive(u)) u.burning = S.tick + 20;
    }
    // buildings, saplings and fire on the struck tile and its neighbours
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const xx = tx + dx, yy = ty + dy;
        if (!inMap(xx, yy)) continue;
        const centre = dx === 0 && dy === 0;
        if (!centre && Util.dist(xx + 0.5, yy + 0.5, x, y) > 1.3) continue;
        const i = yy * w + xx;
        if (S.bld[i]) Buildings.damageAt(xx, yy, centre ? 60 : 30, 'lightning');
        if (S.res[i] === RES.TREE && (centre || R.chance(0.6))) {
          S.res[i] = 0; S.amt[i] = 0; S.markDirty(xx, yy);
          fx('smoke', xx + 0.5, yy + 0.5, { ttl: 0.8 });
        }
        const p = burnChance(i, 0.6) * (centre ? 1 : 0.4);               // a struck forest / house / grass tile (60%) catches fire
        if (p > 0 && R.f() < p && World.ignite(xx, yy)) fx('fire', xx + 0.5, yy + 0.5, { ttl: 0.7 });
      }
    }
    return msg(killed > 0 ? 'Молния убила: ' + killed : 'Молния!', true);
  }

  // ------------------------------------------------------------------ meteor
  function meteor(x, y, r) {
    x = num(x, NaN); y = num(y, NaN);
    if (!(x === x) || !(y === y) || !S.tile || !inMap(x, y)) return msg('Вне карты', false);
    r = rInt(r, 2, 6, 2);
    const L = eff().meteors;
    if (L.length >= METEOR_CAP) return msg('Небо уже в огне', false);
    L.push({ x, y, r, eta: S.tick + METEOR_DELAY, t0: S.tick });
    return msg('Метеорит летит!', true);
  }

  function impact(e) {
    const cx = e.x, cy = e.y, r = e.r > 0 ? e.r : 2, w = S.w, h = S.h;
    const tx = Math.floor(cx), ty = Math.floor(cy);
    if (!inMap(tx, ty)) return;
    const rc = r * 0.7, rl = Math.max(0.8, r * 0.38), rf = r * 1.15, blast = r * 1.9 + 1;
    const pop0 = S.units.size, bld0 = S.buildings.size;
    const city = nearestCity(cx, cy, r + 14);
    // 1) creatures: lethal in the crater, falloff in the blast wave
    const list = inRad(cx, cy, blast);
    for (let i = 0; i < list.length; i++) {
      const u = list[i], d = Util.dist(u.x, u.y, cx, cy);
      if (d <= rc + 0.4) Units.damage(u, 999, 'meteor');
      else Units.damage(u, 50 * (1 - (d - rc) / (blast - rc)), 'meteor');
    }
    // 2) terrain: lava core, hill / mountain rim, burning surroundings
    const ri = Math.ceil(rf) + 1;
    let lava = 0;
    for (let yy = Math.max(0, ty - ri); yy <= Math.min(h - 1, ty + ri); yy++) {
      for (let xx = Math.max(0, tx - ri); xx <= Math.min(w - 1, tx + ri); xx++) {
        const d = Util.dist(xx + 0.5, yy + 0.5, cx, cy);
        const centre = xx === tx && yy === ty;
        if (d > rf && !centre) continue;
        const i = yy * w + xx, t = S.tile[i];
        const water = isWaterT(t);
        if (d <= rc || centre) {
          if (S.bld[i]) removeBuilding(xx, yy, 'meteor');
          if (water) {
            if (R.f() < 0.3) fx('splash', xx + 0.5, yy + 0.5, { ttl: 0.7 });
            continue;
          }
          if (t === T.LAVA) continue;
          if (d <= rl || centre) {
            World.setTile(xx, yy, T.LAVA); lava++;
          } else if (r >= 3 && d > rc * 0.8 && R.chance(0.25)) {
            World.setTile(xx, yy, T.MOUNTAIN, { elev: 196 + R.i(14) });          // ridge of ejecta
          } else {
            World.setTile(xx, yy, T.HILL, { elev: 164 + R.i(20) });              // lowered, rubble-filled bowl
          }
        } else if (!water) {
          const bid = S.bld[i];
          if (bid) Buildings.damageAt(xx, yy, 70 * (1 - (d - rc) / (rf - rc + 0.01)), 'meteor');
          if (S.res[i] === RES.TREE || S.res[i] === RES.BERRY) { S.res[i] = 0; S.amt[i] = 0; S.markDirty(xx, yy); }
          if (R.f() < 0.65) World.ignite(xx, yy);
        }
      }
    }
    // 3) show
    fx('explosion', cx, cy, { ttl: 1.0, r: r * 1.35 });
    fx('explosion', cx + R.between(-0.6, 0.6) * r * 0.4, cy + R.between(-0.6, 0.6) * r * 0.4, { ttl: 0.8, r: r * 0.8 });
    fx('quake', cx, cy, { ttl: 0.9, r: r * 1.2, shake: Math.min(1, 0.3 + r * 0.1) });
    fx('dust', cx, cy, { ttl: 1.0 });
    for (let k = 0; k < 3; k++) {
      const a = R.f() * TAU, d = R.f() * rc + 0.5;
      fx('ash', cx + Math.cos(a) * d, cy + Math.sin(a) * d, { ttl: 1.4 });
      fx('smoke', cx + Math.cos(a + 1.7) * d, cy + Math.sin(a + 1.7) * d, { ttl: 1.2, n: 3 });
    }
    fx('spark', cx, cy, { ttl: 0.8, n: 12 });
    // 4) chronicle
    const dead = pop0 - S.units.size, razed = bld0 - S.buildings.size;
    if (dead >= 3 || razed >= 2) {
      const where = city ? ' рядом с «' + city.name + '»' : '';
      const parts = [];
      if (dead > 0) parts.push('погибло: ' + dead);
      if (razed > 0) parts.push('разрушено построек: ' + razed);
      Log.add('Метеорит упал' + where + ' (' + parts.join(', ') + ')', LOG.DISASTER, tx, ty, city ? city.kingdomId : 0);
    }
  }

  function stepMeteors(tick) {
    const L = eff().meteors;
    if (L.length === 0) return;
    let wr = 0;
    for (let k = 0; k < L.length; k++) {
      const e = L[k];
      if (!e || !(e.x === e.x) || !(e.y === e.y)) continue;
      if (tick >= e.eta) {
        try { impact(e); } catch (err) { report(err, 'meteor impact'); }
        continue;
      }
      L[wr++] = e;
    }
    L.length = wr;
  }

  // ------------------------------------------------------------------ fire
  function fireTool(x, y, r, first, lx, ly) {
    const pts = first ? 1 : plan(lx, ly, x, y, Math.max(1, r * 0.8));
    let lit = 0;
    for (let k = 0; k < pts; k++) {
      const px = first ? x : stX[k], py = first ? y : stY[k];
      lit += fireAt(px, py, r, k === pts - 1);
    }
    return msg(lit > 0 ? 'Огонь!' : 'Нечему гореть', lit > 0);
  }
  function fireAt(x, y, r, withFx) {
    const w = S.w, h = S.h, rr = r + 0.5, cx = Math.floor(x), cy = Math.floor(y);
    let lit = 0, fxLeft = 4;
    // creatures in the flames catch fire
    const list = inRad(x, y, rr);
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      if (R.f() < 0.5) Units.damage(u, 3, 'fire');
    }
    for (let yy = Math.max(0, cy - r); yy <= Math.min(h - 1, cy + r); yy++) {
      for (let xx = Math.max(0, cx - r); xx <= Math.min(w - 1, cx + r); xx++) {
        const d = Util.dist(xx + 0.5, yy + 0.5, x, y);
        if (d > rr) continue;
        const p = burnChance(yy * w + xx) * (1 - 0.35 * d / rr);
        if (p > 0 && R.f() < p && World.ignite(xx, yy)) {
          lit++;
          if (withFx && fxLeft > 0) { fxLeft--; fx('fire', xx + 0.5, yy + 0.5, { ttl: 0.7 }); }
        }
      }
    }
    if (lit === 0 && inMap(cx, cy)) {                   // always try the tile under the finger once
      for (let dy = -1; dy <= 1 && lit === 0; dy++) {
        for (let dx = -1; dx <= 1 && lit === 0; dx++) {
          const xx = cx + dx, yy = cy + dy;
          if (!inMap(xx, yy) || Util.dist(xx + 0.5, yy + 0.5, x, y) > rr) continue;
          if (burnChance(yy * w + xx) > 0 && World.ignite(xx, yy)) { lit++; if (withFx) fx('fire', xx + 0.5, yy + 0.5, { ttl: 0.7 }); }
        }
      }
    }
    if (withFx && lit > 0 && r >= 3) fx('smoke', x, y, { ttl: 1.0 });
    return lit;
  }

  // ------------------------------------------------------------------ earthquake
  function earthquake(x, y, r) {
    x = num(x, NaN); y = num(y, NaN);
    if (!(x === x) || !(y === y) || !S.tile || !inMap(x, y)) return msg('Вне карты', false);
    r = rInt(r, 1, 8, 2);
    const L = eff().quakes;
    while (L.length >= QUAKE_CAP) L.shift();             // the oldest tremor gives way
    const q = { x, y, r: Math.max(2, Math.round(r * 1.5 * 2) / 2), until: S.tick + QUAKE_LIFE, t0: S.tick, b: r, n: 0, m: 8 + 2 * r, h: [] };
    L.push(q);
    launchCracks(q, 2);
    fx('quake', x, y, { ttl: 1.2, r: q.r, shake: Math.min(1, 0.4 + r * 0.08) });
    fx('dust', x, y, { ttl: 0.8 });
    return msg('Земля содрогается!', true);
  }
  function launchCracks(q, n) {
    for (let k = 0; k < n && q.n < q.m; k++) {
      const a = q.n * 2.399963229728653 + R.f() * 0.7;                      // golden-angle fan so cracks do not pile up
      q.h.push([q.x, q.y, a, Math.round(q.b * 1.6) + R.i(3)]);
      q.n++;
    }
  }
  function crackAt(tx, ty, q) {
    if (!inMap(tx, ty)) return;
    const w = S.w, i = ty * w + tx, t = S.tile[i];
    if (S.bld[i]) removeBuilding(tx, ty, 'earthquake');
    const near = inRad(tx + 0.5, ty + 0.5, 1.0);
    for (let k = 0; k < near.length; k++) if (R.f() < 0.7) Units.damage(near[k], 2 + R.i(5), 'earthquake');
    if (isWaterT(t) || t === T.LAVA) return;
    const hard = t === T.MOUNTAIN || t === T.HILL || t === T.SNOW;
    if (R.f() < (hard ? 0.33 : 0.2)) {
      World.setTile(tx, ty, T.LAVA);
      fx('smoke', tx + 0.5, ty + 0.5, { ttl: 1.0 });
    } else {
      let ne = S.elev[i] - (16 + R.i(26));
      if (ne < 72) ne = 72;                              // lowered land sinks at most into shallow water, never into a bottomless pit
      World.setTile(tx, ty, Tiles.fromElev(ne), { elev: ne });
    }
    if (R.f() < 0.5) fx('dust', tx + 0.5, ty + 0.5, { ttl: 0.7, color: '#8e7452' });
  }
  /** quakes created by someone else (or an old save) get the private crack bookkeeping on first use */
  function fixQuake(q) {
    if (!(q.b > 0)) q.b = Math.max(1, Math.min(8, Math.round((q.r || 2) / 1.5)));
    if (!(q.t0 >= 0)) q.t0 = Math.min(S.tick, q.until - QUAKE_LIFE);
    if (!(q.n >= 0)) q.n = 0;
    if (!(q.m >= 0)) q.m = 8 + 2 * q.b;
    if (!Array.isArray(q.h)) q.h = [];
    return q;
  }
  function stepQuake(q, tick) {
    if (!(q.until > tick)) return false;
    if (!Array.isArray(q.h)) fixQuake(q);
    const age = tick - q.t0;
    if (q.n < q.m && age % 2 === 0) launchCracks(q, q.b >= 5 ? 2 : 1);
    const hs = q.h;
    let wr = 0;
    for (let k = 0; k < hs.length; k++) {
      const hd = hs[k];
      hd[0] += Math.cos(hd[2]); hd[1] += Math.sin(hd[2]);
      hd[2] += R.gauss() * 0.55;
      hd[3]--;
      crackAt(Math.floor(hd[0]), Math.floor(hd[1]), q);
      if (hd[3] > 0 && inMap(hd[0], hd[1])) hs[wr++] = hd;
    }
    hs.length = wr;
    if (age > 0 && age % 8 === 0) fx('quake', q.x, q.y, { ttl: 0.5, r: Math.max(1, q.b * 0.6), shake: 0.25 });
    return true;
  }

  // ------------------------------------------------------------------ plague
  function plague(x, y, r) {
    x = num(x, NaN); y = num(y, NaN);
    if (!(x === x) || !(y === y) || !S.tile || !inMap(x, y)) return msg('Вне карты', false);
    r = rInt(r, 1, 8, 2);
    const list = inRad(x, y, r + 0.5);
    let n = 0;
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      if (!R.chance(PLAGUE_P)) continue;
      if (Units.infect(u, S.tick + 600 + R.i(300)) === true) {
        n++;
        if (n <= 6) fx('plague', u.x, u.y, { ttl: 0.9, r: 0.8 });
      }
    }
    fx('plague', x, y, { ttl: 1.1, r: r + 0.5 });
    if (n >= 5) {
      const c = nearestCity(x, y, r + 12);
      Log.add(c ? 'Чума поразила город «' + c.name + '»: заражено ' + n : 'Вспыхнула чума: заражено ' + n, LOG.DISASTER, x | 0, y | 0, c ? c.kingdomId : 0);
    }
    return msg(n > 0 ? 'Заражено: ' + n : 'Некого заражать', n > 0);
  }

  // ------------------------------------------------------------------ tornado
  function tornado(x, y) {
    x = num(x, NaN); y = num(y, NaN);
    if (!(x === x) || !(y === y) || !S.tile || !inMap(x, y)) return msg('Вне карты', false);
    const L = eff().tornados;
    while (L.length >= TORNADO_CAP) {
      const old = L.shift();
      fx('dust', old.x, old.y, { ttl: 1.0 });
    }
    const a = R.f() * TAU, sp = 0.12 + R.f() * 0.04;
    L.push({ x, y, dx: Math.cos(a) * sp, dy: Math.sin(a) * sp, until: S.tick + TORNADO_LIFE, r: TORNADO_R, nt: S.tick + 24 + R.i(14) });
    fx('dust', x, y, { ttl: 0.9 });
    fx('quake', x, y, { ttl: 0.5, r: 1.5, shake: 0.2 });
    return msg('Торнадо!', true);
  }
  function fling(u, cx, cy) {
    const a = Math.atan2(u.y - cy, u.x - cx) + R.between(-1.2, 1.2);
    const dist = 2 + R.f() * 1.2, ca = Math.cos(a), sa = Math.sin(a);
    let nx = u.x, ny = u.y;
    for (let s = 0.5; s <= dist; s += 0.5) {
      const px = u.x + ca * s, py = u.y + sa * s;
      if (!World.walkable(px, py)) break;
      nx = px; ny = py;
    }
    u.x = nx; u.y = ny;                                   // px,py stay: the renderer glides the unit through the air
    if (!u.armyId) {
      u.job = null; u.state = 'idle';
      u.st = { ph: '', since: S.tick, until: S.tick + 8 };
    }
    u.nextThink = S.tick + 2;
  }
  function stepTornado(e, tick) {
    if (!(e.until > tick)) { fx('dust', e.x, e.y, { ttl: 1.0 }); return false; }
    if (!(e.dx === e.dx) || typeof e.dx !== 'number') e.dx = 0;                // pushed by someone else without a heading
    if (!(e.dy === e.dy) || typeof e.dy !== 'number') e.dy = 0;
    if (!(e.r > 0)) e.r = TORNADO_R;
    if (typeof e.nt !== 'number') e.nt = tick + 24;
    if (tick >= e.nt) {                                   // wander: turn a little, change speed a little
      const sp = Util.clamp(Math.sqrt(e.dx * e.dx + e.dy * e.dy) * R.between(0.9, 1.1), 0.09, 0.17);
      const a = Math.atan2(e.dy, e.dx) + R.gauss() * 1.0;
      e.dx = Math.cos(a) * sp; e.dy = Math.sin(a) * sp;
      e.nt = tick + 24 + R.i(14);
    }
    let nx = e.x + e.dx, ny = e.y + e.dy;
    const m = 1.5;
    if (nx < m) { e.dx = Math.abs(e.dx); nx = m; } else if (nx > S.w - m) { e.dx = -Math.abs(e.dx); nx = S.w - m; }
    if (ny < m) { e.dy = Math.abs(e.dy); ny = m; } else if (ny > S.h - m) { e.dy = -Math.abs(e.dy); ny = S.h - m; }
    e.x = nx; e.y = ny;
    const tx = Math.floor(nx), ty = Math.floor(ny), w = S.w;
    const under = S.tile[ty * w + tx];
    if (under === T.DEEP) e.until -= 2; else if (under === T.SHALLOW) e.until -= 1;   // loses strength over the sea
    // trees are torn up
    if ((tick & 1) === 0) {
      for (let k = 0; k < 2; k++) {
        const a = R.f() * TAU, d = Math.sqrt(R.f()) * e.r;
        const px = Math.floor(nx + Math.cos(a) * d), py = Math.floor(ny + Math.sin(a) * d);
        if (!inMap(px, py)) continue;
        const pi = py * w + px;
        if (S.tile[pi] === T.FOREST) {
          World.harvest(px, py, RES.TREE, 45 + R.i(60));
          if (R.f() < 0.3) fx('dust', px + 0.5, py + 0.5, { ttl: 0.6, color: '#5a7a3a' });
        } else if (S.res[pi] === RES.TREE && R.f() < 0.5) {
          World.harvest(px, py, RES.TREE, 80);
        }
      }
    }
    // creatures and buildings under the funnel
    if ((tick & 3) === 0) {
      buf.length = 0;
      Units.nearby(nx, ny, e.r + 0.4, pushBuf);
      for (let k = 0; k < buf.length; k++) {
        const u = buf[k];
        if (Units.damage(u, 6, 'tornado') === true) continue;
        if (alive(u)) fling(u, nx, ny);
      }
      buf.length = 0;
      const ri = Math.ceil(e.r + 0.5);
      for (let yy = ty - ri; yy <= ty + ri; yy++) {
        for (let xx = tx - ri; xx <= tx + ri; xx++) {
          if (!inMap(xx, yy) || !S.bld[yy * w + xx]) continue;
          if (Util.dist(xx + 0.5, yy + 0.5, nx, ny) <= e.r + 0.5) Buildings.damageAt(xx, yy, 8, 'tornado');
        }
      }
      if ((tick & 15) === 0) fx('dust', nx, ny, { ttl: 0.7, color: '#b89c78' });
    }
    return true;
  }

  // ------------------------------------------------------------------ rain
  function rain(x, y, r) {
    x = num(x, NaN); y = num(y, NaN);
    if (!(x === x) || !(y === y) || !S.tile || !inMap(x, y)) return msg('Вне карты', false);
    r = rInt(r, 2, 8, 3);
    const L = eff().rains, until = S.tick + RAIN_LIFE;
    let merged = false;
    for (let i = 0; i < L.length; i++) {                 // a cloud that is nearly in the same place just gets refreshed
      const e = L[i];
      if (Util.dist(e.x, e.y, x, y) < 0.6 * Math.max(e.r, r)) {
        if (e.until < until) e.until = until;
        if (e.r < r) e.r = r;
        merged = true;
        break;
      }
    }
    if (!merged) {
      if (L.length >= RAIN_CAP) {                         // drop the cloud that would end first
        let oi = 0;
        for (let i = 1; i < L.length; i++) if (L[i].until < L[oi].until) oi = i;
        L.splice(oi, 1);
      }
      L.push({ x, y, r, until });
    }
    const n = World.extinguish(x, y, r);
    if (n > 0) fx('smoke', x, y, { ttl: 0.9, n: 3 });
    return msg('Дождь', true);
  }
  let douseTick = 0;
  function douse(u) { if (u.burning > douseTick) u.burning = 0; }
  function stepRain(e, tick) {
    if (!(e.until > tick)) return false;
    if ((tick + (e.r | 0)) % 5 === 0) {
      World.extinguish(e.x, e.y, e.r);
      douseTick = tick;
      Units.nearby(e.x, e.y, e.r, douse);                 // creatures that burn in the rain are put out
    }
    return true;
  }

  // ------------------------------------------------------------------ heal / bless
  function healTool(x, y, r, first, lx, ly) {
    const pts = first ? 1 : plan(lx, ly, x, y, Math.max(1, r * 0.8));
    let n = 0, shown = 0;
    for (let k = 0; k < pts; k++) {
      const px = first ? x : stX[k], py = first ? y : stY[k];
      const list = inRad(px, py, r + 0.5);
      for (let i = 0; i < list.length; i++) {
        const u = list[i];
        const needs = u.hp < u.maxHp || u.sick > S.tick || u.burning > S.tick;
        if (u.sick > S.tick) { u.sick = 0; u.immune = Math.max(u.immune | 0, S.tick + 400); }
        Units.heal(u, u.maxHp);
        u.hp = u.maxHp;
        u.sick = 0;
        if (needs) { n++; if (shown < 5) { shown++; fx('heal', u.x, u.y, { ttl: 0.9, r: 0.8 }); } }
      }
      if (k === pts - 1) fx('heal', px, py, { ttl: 0.9, r: r + 0.5 });
    }
    return msg(n > 0 ? 'Исцелено: ' + n : 'Все здоровы', n > 0);
  }
  function bless(x, y, r) {
    x = num(x, NaN); y = num(y, NaN);
    if (!(x === x) || !(y === y) || !S.tile || !inMap(x, y)) return msg('Вне карты', false);
    r = rInt(r, 1, 8, 2);
    const list = inRad(x, y, r + 0.5);
    let n = 0;
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      u.buffUntil = S.tick + BLESS_TICKS;
      u.buffMul = BLESS_MUL;
      u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.5);
      n++;
      if (n <= 5) fx('bless', u.x, u.y, { ttl: 1.0, r: 0.8 });
    }
    fx('bless', x, y, { ttl: 1.1, r: r + 0.5 });
    return msg(n > 0 ? 'Благословлено: ' + n : 'Некого благословлять', n > 0);
  }

  // ------------------------------------------------------------------ picking
  /** {type:'unit'|'building'|'city'|'tile', id, x, y} for a tap (null outside the map) */
  function pick(tx, ty) {
    tx = num(tx, NaN); ty = num(ty, NaN);
    if (!(tx === tx) || !(ty === ty) || !S.tile || !inMap(tx, ty)) return null;
    const xi = Math.floor(tx), yi = Math.floor(ty), i = yi * S.w + xi;
    // 1) creatures (sprites stand on their feet, so the body is a little above u.y); rulers are easier to hit
    let best = null, bd = 1e9;
    const qy = ty + 0.3;
    const list = inRad(tx, qy, 1.6);
    for (let k = 0; k < list.length; k++) {
      const u = list[k], d = Util.dist(u.x, u.y, tx, qy);
      if (d <= (u.isRuler ? 1.6 : 0.9) && d < bd) { bd = d; best = u; }
    }
    if (best) return { type: 'unit', id: best.id, x: best.x, y: best.y };
    // 2) building on the tile
    const bid = S.bld[i];
    if (bid) {
      const b = S.buildings.get(bid);
      if (b) return { type: 'building', id: b.id, x: b.x, y: b.y };
    }
    // 3) city: centre within 1.5 tiles, else the owner of the tile
    let c = null, cd = 2.25;
    for (const cc of S.cities.values()) {
      const dx = cc.x + 0.5 - tx, dy = cc.y + 0.5 - ty, d2 = dx * dx + dy * dy;
      if (d2 <= cd) { cd = d2; c = cc; }
    }
    if (!c && S.owner[i]) c = S.cities.get(S.owner[i]) || null;
    if (c) return { type: 'city', id: c.id, x: c.x, y: c.y };
    return { type: 'tile', id: i, x: xi, y: yi };
  }

  // ------------------------------------------------------------------ diplomacy tools
  /** kingdom under a tap: a ruler within 2 tiles first, else whatever pick() finds (unit, building, city, territory) */
  function kingdomAt(x, y) {
    if (!S.tile || !inMap(x, y)) return null;
    const ruler = Units.nearest(x, y, 2, (u) => u.isRuler && u.kingdomId > 0 && S.kingdoms.has(u.kingdomId));
    if (ruler) return { kid: ruler.kingdomId, ruler, x: ruler.x, y: ruler.y };
    const p = pick(x, y);
    if (!p) return null;
    let kid = 0, px = p.x, py = p.y;
    if (p.type === 'unit') {
      const u = S.units.get(p.id);
      if (u) { const c = S.cities.get(u.cityId); kid = u.kingdomId || (c ? c.kingdomId : 0); }
    } else if (p.type === 'building') {
      const b = S.buildings.get(p.id), c = b ? S.cities.get(b.cityId) : null;
      if (c) kid = c.kingdomId;
    } else if (p.type === 'city') {
      const c = S.cities.get(p.id);
      if (c) kid = c.kingdomId;
    }
    if (!kid || !S.kingdoms.has(kid)) return null;
    const k = S.kingdoms.get(kid), r = S.units.get(k.rulerId) || null;
    return { kid, ruler: r, x: px, y: py };
  }
  function rulerAcc(u) {
    if (u.race === Const.RACE.ORC) return u.sex === Const.SEX.F ? 'вождиху' : 'вождя';
    if (u.race === Const.RACE.ELF) return u.sex === Const.SEX.F ? 'княгиню' : 'князя';
    return u.sex === Const.SEX.F ? 'королеву' : 'короля';
  }
  function otherSide(res, kid) {
    if (res && typeof res === 'object') {
      return S.kingdoms.get(res.aggressor === kid ? res.defender : res.aggressor) || null;
    }
    if (typeof res === 'number') return S.kingdoms.get(res) || null;
    return null;
  }

  function warWhisper(x, y) {
    x = num(x, NaN); y = num(y, NaN);
    const t = kingdomAt(x, y);

  function apply(toolId, tx, ty, radius, phase) {

    const def = ToolDefs.byId[id];

    if (phase === 'end') { if (drag.tool === id) drag.tool = ''; return false; }
    if (phase !== 'tap' && phase !== 'start' && phase !== 'move') return false;

    if (!(x === x) || !(y === y)) return msg('Некорректная цель', false);

    if (!first) {

    }

    const margin = def.group === 'terrain' ? r : 0;

    if (first) {
      drag.tool = id; drag.x = x; drag.y = y; drag.tick = S.tick; drag.sx = x; drag.sy = y; drag.st = S.tick; drag.n = 0;

      case 'erase': return eraseTool(x, y, r, first, lx, ly);

      case 'meteor': return meteor(x, y, Math.max(2, r));
      case 'fire': return fireTool(x, y, r, first, lx, ly);

  }

    const e = eff();
    const good = (q) => q && typeof q === 'object' && num(q.x, NaN) === q.x && num(q.y, NaN) === q.y;
    e.meteors = e.meteors.filter((m) => good(m) && num(m.eta, NaN) === m.eta);
    e.rains = e.rains.filter((m) => good(m) && num(m.until, NaN) === m.until);
    e.tornados = e.tornados.filter((m) => good(m) && num(m.until, NaN) === m.until).map((m) => {
      if (typeof m.dx !== 'number' || !(m.dx === m.dx)) m.dx = 0.1;
      if (typeof m.dy !== 'number' || !(m.dy === m.dy)) m.dy = 0;

    // extras
    kingdomAt,
    /** number of active persistent effects, for UI / tests */
    active() { const e = eff(); return { meteors: e.meteors.length, tornados: e.tornados.length, rains: e.rains.length, quakes: e.quakes.length }; },

/* =====================================================================
 * 12_sim.js — Sim: tick orchestrator, per-module cost profile, stats, performance degradation,
 *             world creation + initial population.
 * OWNER: Sim+Save agent. API: docs/CONTRACT.md §3 Sim.  DOM-free (runs headless in node).
 *
 *  - Sim.step()        one tick: S.tick++ -> World -> Buildings -> Units -> Cities -> Kingdoms -> Diplomacy -> War -> Powers.
 *                      Every module call is wrapped in try/catch; a failing module is reported with console.error at most once per
 *                      100 ticks per module (counters stay in Sim.errors) and never stops the loop.
 *  - Sim.profile       {World:ms,...,total:ms} exponential moving average of the cost of each module step (wall clock, ms/tick).
 *  - Sim.stats()       recompute S.stats (auto every 10 ticks inside step).
 *  - Sim.adaptPerf(ms) graceful degradation: S.perf.thinkEvery 3..6, S.perf.lod 0..2, S.perf.unitCap.
 *  - Sim.newWorld / Sim.populate / Sim.afterLoad (see contract).
 *
 * Nothing here influences gameplay randomness except populate()/newWorld(), which only use R (seeded). Wall-clock measurements
 * (profile, adaptPerf) feed S.perf (a performance hint) only — the simulation outcome for a given perf level is deterministic.
 * ===================================================================== */

const Sim = (() => {

  let modsCache = null;                       // [{name, mod}] — resolved lazily (modules are not available at load time)

  function lookup(name) {
    try {
      switch (name) {
        case 'World': return typeof World !== 'undefined' ? World : null;
        case 'Buildings': return typeof Buildings !== 'undefined' ? Buildings : null;
        case 'Units': return typeof Units !== 'undefined' ? Units : null;
        case 'Cities': return typeof Cities !== 'undefined' ? Cities : null;
        case 'Kingdoms': return typeof Kingdoms !== 'undefined' ? Kingdoms : null;
        case 'Diplomacy': return typeof Diplomacy !== 'undefined' ? Diplomacy : null;
        case 'War': return typeof War !== 'undefined' ? War : null;
        case 'Powers': return typeof Powers !== 'undefined' ? Powers : null;
      }
    } catch (e) { /* TDZ / missing */ }
    return null;
  }

  const profile = { total: 0 };

  const lastLogged = {};                      // module name -> tick of the last console.error
  const lastError = {};                       // module name -> last exception
  let totalErrors = 0;

  function resetProfile() {
    for (const k in profile) profile[k] = 0;
    profPrimed = false;

    for (const k in lastLogged) delete lastLogged[k];
    for (const k in lastError) delete lastError[k];
    totalErrors = 0;
  }

    errors[name] = (errors[name] || 0) + 1;
    totalErrors++;

    if (last === undefined || S.tick - last >= 100 || S.tick < last) {
      lastLogged[name] = S.tick;

    if (P.pressure >= 2) lod++;
    if (P.pressure >= 3) lod++;

    profile,

    refresh,
    get errors() { return errors; },
    get totalErrors() { return totalErrors; },
    get lastError() { return lastError; },
    get perfState() { return P; },
    resetProfile,

})();

  // ------------------------------------------------------------------ entity tables (keys once, rows as arrays)

  const IDENT = /^[A-Za-z_$][A-Za-z0-9_$]*$/;
  /**
   * Entities must be rebuilt as OBJECT LITERALS: objects grown key by key with `o[key] = v` (45+ properties) fall into V8's dictionary mode
   * and made Units.step 3.5x slower after a load. A generated literal gives them fast in-object properties like freshly spawned units.
   */

      for (let j = 0; j < keys.length; j++) {

    const keys = tbl.k, nk = keys.length;

    const out = new Array(rows.length);

  function finite(v) { return typeof v === 'number' && isFinite(v); }

  function unitsForSave(opts) {
    const out = [];

      if (!finite(u.x) || !finite(u.y) || !finite(u.id)) { skipped++; continue; }    // never write a unit that could not be loaded again

  }

  function popTotals() {
    const pop = [0, 0, 0];
    for (const u of S.units.values()) if (u.race >= 0 && u.race < 3) pop[u.race]++;

  }

  function makeMeta(bytes) {
    const pop = popTotals();
    let kingdoms = 0;
    for (const k of S.kingdoms.values()) if (k.alive !== false) kingdoms++;
    return { v: Const.SAVE_VERSION, savedAt: clock(), year: Util.year(), tick: S.tick, pop: pop[0] + pop[1] + pop[2], popRace: pop, kingdoms, cities: S.cities.size, w: S.w, h: S.h, seed: S.seed, bytes: bytes | 0 };
  }

  /** whole world -> JSON string. opts: {stripPaths:false, savedAt} */
  function serialize(opts) {
    opts = opts || {};

    try { Sim.stats(); } catch (e) { /* stats are only a cache */ }
    const layers = {};
    for (const name of LAYER_NAMES) layers[name] = encodeLayer(S[name], LAYER_TYPE[name]);
    const data = {
      v: Const.SAVE_VERSION, game: 'godsim', savedAt: opts.savedAt !== undefined ? opts.savedAt : clock(),
      w: S.w, h: S.h, seed: S.seed, tick: S.tick, rng: R.getState(), nextId: S.nextId, nextLogId: S.nextLogId,
      layers,
      units: packTable(unitsForSave(opts)),
      cities: packTable(Array.from(S.cities.values())),
      kingdoms: packTable(Array.from(S.kingdoms.values())),
      buildings: packTable(Array.from(S.buildings.values())),
      armies: packTable(Array.from(S.armies.values())),
      wars: packTable(Array.from(S.wars.values())),
      rels: Array.from(S.rels.entries()),
      cultures: S.cultures,
      log: S.log.length > LOG_KEEP ? S.log.slice(S.log.length - LOG_KEEP) : S.log,

  }

  // ------------------------------------------------------------------ validation (everything is checked / repaired BEFORE the live state is touched)
  function fail(msg) { throw new Error(msg); }
  function isInt(v) { return typeof v === 'number' && isFinite(v) && Math.floor(v) === v; }
  function num(v, d) { return finite(v) ? v : d; }

  function validate(data) {

    const tile = out.layers.tile, res = out.layers.res;
    for (let i = 0; i < n; i++) { if (tile[i] >= Const.TILE_COUNT) fail('bad tile id'); if (res[i] > 6) fail('bad resource id'); }

      if (u.y < 0) u.y = 0; else if (u.y > h - 0.001) u.y = h - 0.001;

      if (!finite(u.maxHp) || u.maxHp <= 0) { u.maxHp = 20; out.repaired++; }
      if (!finite(u.hp)) { u.hp = u.maxHp; out.repaired++; }

      u.xp = num(u.xp, 0); u.kills = num(u.kills, 0);
      u.nextThink = num(u.nextThink, 0); u.birthCd = num(u.birthCd, 0);
      u.sick = num(u.sick, 0); u.buffUntil = num(u.buffUntil, 0); u.burning = num(u.burning, 0);
      if (typeof u.state !== 'string' || !stateOk[u.state]) { u.state = 'idle'; u.st = {}; u.job = null; out.repaired++; }

      rains: Array.isArray(eff.rains) ? eff.rains : [], quakes: Array.isArray(eff.quakes) ? eff.quakes : [],
    };
    out.mod = data.mod && typeof data.mod === 'object' && !Array.isArray(data.mod) ? data.mod : {};
    const st = data.stats && typeof data.stats === 'object' ? data.stats : {};
    out.stats = Object.assign({ year: Const.START_YEAR, pop: [0, 0, 0], popTotal: 0, kingdoms: 0, cities: 0, wars: 0, buildings: 0 }, st);

        v: data.v, savedAt: finite(data.savedAt) ? data.savedAt : 0, year: Const.START_YEAR + Math.floor(data.tick / Const.TICKS_PER_YEAR), tick: data.tick,
        pop: pop[0] + pop[1] + pop[2], popRace: pop, kingdoms: data.kingdoms && data.kingdoms.r ? data.kingdoms.r.length : 0,
        cities: data.cities && data.cities.r ? data.cities.r.length : 0, w: data.w, h: data.h, seed: data.seed, bytes: d.length,
      };
      try { st.setItem(key + '.meta', JSON.stringify(meta)); } catch (e) { /* ignore */ }
      return meta;
    } catch (e) { return null; }
  }

  function remove(slot) {
    const st = getStorage(), key = keyOf(slot);
    if (!st || !key) return false;
    try { st.removeItem(key); st.removeItem(key + '.meta'); return true; } catch (e) { return false; }
  }

  return {
    save, load, exists, info, remove, serialize, deserialize,
    get storage() { return getStorage(); },
    set storage(s) { injected = s || null; },
    // extras
    slots: SLOTS,
    get lastError() { return lastError; },
    get lastLoad() { return lastLoad; },
    get compress() { return compress; },
    set compress(v) { compress = !!v; },
    pack, unpack, lzCompress, lzDecompress,
    set clock(fn) { clock = typeof fn === 'function' ? fn : () => Date.now(); },
    get clock() { return clock; },
    bytesToB64, b64ToBytes, encodeLayer, decodeLayer, packTable, unpackTable,

})();

/* =====================================================================
 * 20_sprites.js — Sprites: 100% procedural pixel art (no external assets)

  function buildUnit(race, stage, fr, tint, weapon, armor, look) {
    const b = new Buf(TS, TS), P = unitPal(race, stage, look, tint), rg = RIG[race][stage], d = fr ? 0 : 1;
    const lg = rg.legs, topL = lg.top || 'p', botL = lg.bot || 'b';

    for (let i = 0; i < 2; i++) {
      let x = lg.x[i], y = lg.y, h = lg.h;

      b.art(ch[armor], P, rg.chest.x, rg.chest.y + d);

  let zoomTarget = 0, zoomTapAt = 0;
  function zoomBy(f) {
    const cam = Render.cam;
    const c = visibleCenter();
    const t = Render.screenToTile(c.x, c.y);
    const nowMs = performance.now();
    const base = nowMs - zoomTapAt < 500 && zoomTarget > 0 ? zoomTarget : cam.zoom;   // quick repeated taps build on the glide target
    const z = Util.clamp(base * f, Render.minZoom(), Render.maxZoom());
    zoomTarget = z; zoomTapAt = nowMs;
    // keep the tile under the visible centre fixed: shift camera accordingly
    const sz = Render.size;
    const nx = t.x - (c.x - sz.w / 2) / z, ny = t.y - (c.y - sz.h / 2) / z;     // (visible centre stays put)
    Render.focusOn(nx, ny, z);
  }

  const FEED_LIFE = { birth: 4500, death: 5500, info: 5500 };
  const BIG_KIND = { war: 1, peace: 1, disaster: 1, kingdom: 1, rebel: 1, god: 1 };
  function flushFeed(now) {
    if (!feed.pending.length) return;
    const list = feed.pending.splice(0, feed.pending.length);
    const from = Math.max(0, list.length - 4);
    for (let i = from; i < list.length; i++) addFeedLine(list[i], now);
  }
  function addFeedLine(e, now) {
    for (let i = 0; i < feed.items.length; i++) if (feed.items[i].msg === e.msg) { feed.items[i].born = now; return; }
    const line = el('button', 'fl' + (e.x >= 0 ? ' go' : '') + (BIG_KIND[e.kind] ? ' big' : ''));
    line.type = 'button';
    const dot = el('i'); dot.style.color = KIND_COLOR[e.kind] || KIND_COLOR.info;
    line.appendChild(dot);
    line.appendChild(el('span', '', e.msg));
    line.addEventListener('click', () => openLog());
    refs.feed.appendChild(line);
    feed.items.push({ node: line, born: now, msg: e.msg, life: FEED_LIFE[e.kind] || 8000 });
    while (feed.items.length > 4) { const old = feed.items.shift(); if (old.node.parentNode) old.node.parentNode.removeChild(old.node); }
  }
  function fadeFeed(now) {
    for (let i = feed.items.length - 1; i >= 0; i--) {
      const it = feed.items[i];
      const age = now - it.born;
      if (age > it.life + 900) { if (it.node.parentNode) it.node.parentNode.removeChild(it.node); feed.items.splice(i, 1); }
      else if (age > it.life && !it.fading) { it.fading = true; it.node.classList.add('fade'); }
      else if (it.fading && age <= it.life) { it.fading = false; it.node.classList.remove('fade'); }
    }
  }
  function clearFeed() {
    feed.pending.length = 0;
    for (const it of feed.items) if (it.node.parentNode) it.node.parentNode.removeChild(it.node);
    feed.items.length = 0;
  }

  function modalOpen() { return modals.length > 0; }
  /** opts: {title, tall, onClose, dismiss (default true), foot} -> {close, body, head, card, setTitle} */
  function openModal(opts) {
    opts = opts || {};
    Input.cancel();
    const back = el('div', 'm-back');
    const card = el('div', 'm-card' + (opts.tall ? ' tall' : ''));
    card.setAttribute('role', 'dialog');
    const head = el('div', 'm-head');
    const h2 = el('h2', '', opts.title || '');
    head.appendChild(h2);
    const closeBtn = btn('sh-btn', 'Закрыть', () => m.close());
    closeBtn.appendChild(ico('close', 24));
    const body = el('div', 'm-body');
    card.appendChild(head); card.appendChild(body);
    let foot = null;
    if (opts.foot) { foot = el('div', 'm-foot'); card.appendChild(foot); }
    back.appendChild(card);
    if (opts.dismiss !== false) {
      back.addEventListener('click', (ev) => { if (ev.target === back) m.close(); });
      head.appendChild(closeBtn);
    }
    refs.modals.appendChild(back);
    const m = {
      back, card, head, body, foot, h2, closeBtn,
      setTitle(t) { h2.textContent = t; },
      close() {
        const i = modals.indexOf(m);
        if (i < 0) return;

        if (back.parentNode) back.parentNode.removeChild(back);
        if (!modals.length) document.body.classList.remove('modal-open');

    };
    modals.push(m);
    document.body.classList.add('modal-open');

  }

  function hashSeed(str) {
    str = String(str).trim();

    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }

  function openLog() {
    if (logPanel) return;
    const m = openModal({ title: 'Журнал', tall: true, onClose: () => { logPanel = null; } });
    const filters = el('div', 'filters');
    m.card.insertBefore(filters, m.body);
    const lp = { m, filter: 'all', lastId: 0, count: 0 };
    logPanel = lp;
    LOG_FILTERS.forEach((f) => {
      const b = btn(f.id === 'all' ? 'on' : '', f.name, () => { lp.filter = f.id; [...filters.children].forEach((c) => c.classList.toggle('on', c === b)); rebuild(); });
      b.textContent = f.name;
      filters.appendChild(b);
    });
    function pass(e) {
      const f = LOG_FILTERS.find((x) => x.id === lp.filter);
      return !f || !f.kinds || f.kinds.indexOf(e.kind) >= 0;
    }
    function rebuild() {
      clear(m.body);
      lp.count = 0;
      const arr = S.log;
      lp.lastId = arr.length ? arr[arr.length - 1].id : 0;
      for (let i = arr.length - 1; i >= 0; i--) if (pass(arr[i])) { m.body.appendChild(logRow(arr[i])); lp.count++; }
      if (!lp.count) m.body.appendChild(el('div', 'muted', 'Пока тихо. Мир ещё не успел ничего натворить.'));
      m.body.scrollTop = 0;
    }
    lp.refresh = () => {
      const arr = S.log;
      if (!arr.length) return;
      const lastId = arr[arr.length - 1].id;
      if (lastId === lp.lastId) return;
      const fresh = [];
      for (let i = arr.length - 1; i >= 0 && arr[i].id > lp.lastId; i--) fresh.push(arr[i]);
      lp.lastId = lastId;
      const ph = m.body.querySelector('.muted'); if (ph) ph.remove();
      const atTop = m.body.scrollTop < 8;
      for (let i = fresh.length - 1; i >= 0; i--) if (pass(fresh[i])) { m.body.insertBefore(logRow(fresh[i]), m.body.firstChild); lp.count++; }
      while (m.body.children.length > 320) m.body.removeChild(m.body.lastChild);
      if (atTop) m.body.scrollTop = 0;
    };
    rebuild();
  }

  // ------------------------------------------------------------------ kingdom list helpers
  function kingdomList() {
    const out = [];
    for (const k of S.kingdoms.values()) {
      if (k.alive === false) continue;
      let pop = 0;
      for (let i = 0; i < k.cities.length; i++) { const c = S.cities.get(k.cities[i]); if (c) pop += c.pop || 0; }
      out.push({ k, pop });
    }
    out.sort((a, b) => b.pop - a.pop || a.k.id - b.k.id);
    return out;
  }
  function kingdomAtWar(kid) {
    try {
      if (typeof War !== 'undefined' && War.warsOf) { const w = War.warsOf(kid); if (w && w.length) return true; }
    } catch (e) { /* ignore */ }
    for (const w of S.wars.values()) {
      if (w.ended) continue;
      if ((w.attackers && w.attackers.indexOf(kid) >= 0) || (w.defenders && w.defenders.indexOf(kid) >= 0)) return true;
    }
    return false;
  }
  function updateChips(force) {
    const kb = refs.kbar;
    const list = kingdomList();
    let sig = '';
    for (const x of list) sig += x.k.id + ':' + x.pop + ':' + (kingdomAtWar(x.k.id) ? 1 : 0) + ':' + x.k.name + ':' + flagSig(x.k.flag) + ';';
    if (!force && sig === chipSig) return;
    chipSig = sig;
    if (!list.length) {
      if (!kb.querySelector('.kempty')) { clear(kb); chipMap.clear(); kb.appendChild(el('div', 'kempty', 'Королевств пока нет — они появятся вместе с первыми городами')); }
      return;
    }
    const e = kb.querySelector('.kempty'); if (e) e.remove();
    const alive = new Set();
    list.forEach((x, idx) => {
      const k = x.k;
      alive.add(k.id);
      let ch = chipMap.get(k.id);
      if (!ch) {
        const b = btn('kchip', k.name, () => { const kk = S.kingdoms.get(k.id); if (kk) { openInspector('kingdom', k.id, { focus: true }); } });
        const fl = flagEl(k.flag, 24);
        const kn = el('span', 'kn'); const nm = el('b'); const sm = el('small');
        kn.appendChild(nm); kn.appendChild(sm);
        b.appendChild(fl); b.appendChild(kn);
        ch = { b, fl, nm, sm };
        chipMap.set(k.id, ch);
      }
      ch.b.style.setProperty('--kc', k.color);
      drawFlag(ch.fl, k.flag);
      setText(ch.nm, k.name);
      const war = kingdomAtWar(k.id);
      const txt = x.pop + ' жит. · ' + k.cities.length + ' гор.' + (war ? ' · ' : '');
      if (ch.sm._t !== txt + war) {
        ch.sm._t = txt + war;
        ch.sm.textContent = txt;
        if (war) ch.sm.appendChild(el('u', '', 'война'));
      }
      if (ch.b.parentNode !== kb || kb.children[idx] !== ch.b) kb.insertBefore(ch.b, kb.children[idx] || null);
    });
    for (const [id, ch] of chipMap) if (!alive.has(id)) { if (ch.b.parentNode) ch.b.parentNode.removeChild(ch.b); chipMap.delete(id); }
  }

  // ------------------------------------------------------------------ inspector: open / close / refresh
  function buildView(type, id) {
    switch (type) {
      case 'unit': return viewUnit(id);
      case 'building': return viewBuilding(id);
      case 'city': return viewCity(id);
      case 'kingdom': return viewKingdom(id);
      case 'tile': return viewTile(id);
    }
    return null;
  }
  /** opts: {push: keep previous view for the back button, focus: glide the camera to the object} */
  function openInspector(type, id, opts) {
    opts = opts || {};
    if (!ready) return false;
    let v = null;
    try { v = buildView(type, id); } catch (e) { console.error('inspector', e); v = null; }
    if (!v) { toast('Объект больше недоступен', 'bad'); return false; }
    const stack = insp ? insp.stack : [];
    if (opts.push && insp && !(insp.type === type && insp.id === id)) { stack.push({ type: insp.type, id: insp.id }); if (stack.length > 10) stack.shift(); }
    else if (!opts.push) stack.length = 0;
    insp = { type, id, view: v, stack };
    renderSheet();
    runUpdaters(v);
    Render.highlight = v.hl ? Object.assign({}, v.hl) : null;
    refs.bottom.classList.add('sheet-open');
    layoutSoon();
    const f = v.focus ? v.focus() : null;
    if (f) {
      if (opts.focus) requestAnimationFrame(() => focusVisible(f.x, f.y, Math.max(Render.cam.zoom, v.zoom || 12)));
      else requestAnimationFrame(() => ensureVisible(f.x, f.y));
    }
    return true;
  }
  function goBack() {
    if (!insp) return;
    const p = insp.stack.pop();
    if (!p) return;
    let w = null;
    try { w = buildView(p.type, p.id); } catch (e) { w = null; }
    if (!w) { if (insp.stack.length) goBack(); else closeInspector(); return; }
    insp = { type: p.type, id: p.id, view: w, stack: insp.stack };
    renderSheet();
    runUpdaters(w);
    Render.highlight = w.hl ? Object.assign({}, w.hl) : null;
    const f = w.focus ? w.focus() : null;
    if (f) requestAnimationFrame(() => ensureVisible(f.x, f.y));
  }
  function renderSheet() {
    const sh = refs.sheet;
    clear(sh);
    sh.style.animation = 'none'; void sh.offsetWidth; sh.style.animation = '';
    const v = insp.view;
    const head = el('div', 'sh-head');
    if (insp.stack.length) {
      const b = btn('sh-btn back', 'Назад', goBack);
      b.textContent = '‹';
      head.appendChild(b);
    }
    head.appendChild(v.ava);
    const tt = el('div', 'sh-title'); tt.appendChild(v.title); tt.appendChild(v.sub); head.appendChild(tt);
    const fb = btn('sh-btn primary', 'Показать на карте', () => {
      const f = v.focus ? v.focus() : null;
      if (f) focusVisible(f.x, f.y, Math.max(Render.cam.zoom, v.zoom || 12));
      if (v.hl) Render.highlight = Object.assign({}, v.hl);
    });
    fb.title = 'Показать на карте';
    fb.appendChild(ico('focus', 24));
    fb.appendChild(el('span', 't', 'На карте'));
    head.appendChild(fb);
    const cb = btn('sh-btn', 'Закрыть', () => closeInspector());
    cb.appendChild(ico('close', 24));
    head.appendChild(cb);
    sh.appendChild(head);
    const body = el('div', 'sh-body');
    body.appendChild(v.body);
    sh.appendChild(body);
    refs.sheetBody = body;
  }
  function runUpdaters(v) {
    for (let i = 0; i < v.ups.length; i++) {
      try { v.ups[i](); } catch (e) { if (!v.warned) { v.warned = true; console.error('inspector update', e); } }
    }
    if (refs.sheetBody) refs.sheetBody.classList.toggle('dead', !!v.dead);
    if (v.finished && Render.highlight && v.hl && Render.highlight.id === v.hl.id && Render.highlight.type === v.hl.type && v.hl.type === 'unit') Render.highlight = null;
  }
  function updateInspector() {
    if (!insp) return;
    if (!insp.view.finished || insp._fin !== true) {
      runUpdaters(insp.view);
      if (insp.view.finished) insp._fin = true;
    }
  }
  function closeInspector() {
    if (!insp) return;
    insp = null;
    Render.highlight = null;
    refs.bottom.classList.remove('sheet-open');
    clear(refs.sheet);
    layoutSoon();
  }
  function inspectAt(tx, ty, explicit) {
    const p = Powers.pick(tx, ty);
    if (!p) { return; }
    if (p.type === 'tile' && !explicit) { closeInspector(); return; }
    openInspector(p.type, p.id);
  }

  // ------------------------------------------------------------------ camera helpers shared with Main
  /** the part of the screen not covered by the top bar / dock / sheet (css px) */
  function bandInfo() {
    const sz = Render.size;
    const top = refs.top ? refs.top.getBoundingClientRect().bottom : 0;
    let bot = sz.h, left = 0, right = sz.w;
    if (refs.bottom) {
      if (refs.bottom.classList.contains('sheet-open')) {
        const r = refs.sheet.getBoundingClientRect();
        if (r.width < sz.w * 0.9 && r.left > sz.w * 0.3) right = r.left;     // landscape: side panel
        else bot = r.top;
      } else bot = sz.h - refs.bottom.getBoundingClientRect().height;
    }
    return { w: sz.w, h: sz.h, top: top + 8, bot: Math.max(top + 60, bot - 8), left, right: Math.max(left + 120, right - 8) };
  }
  /** glide so that tile (x,y) sits in the middle of the area not covered by the top bar / dock / sheet */
  function focusVisible(x, y, zoom, instant) {
    const bi = bandInfo();
    const z = zoom > 0 ? Util.clamp(zoom, Render.minZoom(), Render.maxZoom()) : Render.cam.zoom;
    const cx = (bi.left + bi.right) / 2, cy = (bi.top + bi.bot) / 2;
    Render.focusOn(x - (cx - bi.w / 2) / z, y - (cy - bi.h / 2) / z, z, instant);
  }
  function ensureVisible(x, y) {
    const bi = bandInfo();
    const p = Render.tileToScreen(x, y);
    const m = 36;
    if (p.x > bi.left + m && p.x < bi.right - m && p.y > bi.top + m && p.y < bi.bot - m) return;
    focusVisible(x, y, Render.cam.zoom);
  }

  // ------------------------------------------------------------------ layout bookkeeping
  let layoutQueued = false;
  function layoutSoon() { if (layoutQueued) return; layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layout(); }); }
  function layout() {
    if (!ready) return;
    const top = refs.top.getBoundingClientRect().bottom;
    const bh = refs.bottom.getBoundingClientRect().height;
    const bi = bandInfo();
    Render.pad.t = Math.round(top);
    Render.pad.b = Math.round(bh);
    Render.pad.r = Math.round(Math.max(0, bi.w - bi.right - 8));
    document.documentElement.style.setProperty('--top-h', Math.round(top) + 'px');
    document.documentElement.style.setProperty('--bot-h', Math.round(bh) + 'px');
  }

  // ------------------------------------------------------------------ input callbacks
  function applyTool(tool, tx, ty, phase) {
    const def = ToolDefs.byId[tool];
    if (!def) return false;
    const r = def.brush ? state.brush : 1;
    let ok = false;
    try { ok = Powers.apply(tool, tx, ty, r, phase); } catch (e) { console.error('Powers.apply', e); }
    if (!ok && phase !== 'end') {
      const m = Powers.lastMessage;
      if (m) toast(m, 'bad');
    }
    if (def.brush && phase !== 'end') { Render.brush = { x: tx, y: ty, r }; clearTimeout(brushTimer); brushTimer = setTimeout(() => { if (!Input.painting) Render.brush = null; }, 650); }
    return ok;
  }
  function handleTap(tx, ty) {
    if (!ready || modalOpen()) return;
    const tool = state.tool;
    if (!tool || tool === 'inspect') { inspectAt(tx, ty, tool === 'inspect'); return; }
    if (insp) closeInspector();                        // the dock (with the active tool) comes back
    applyTool(tool, tx, ty, 'tap');
  }
  function handlePaint(tx, ty, phase) {
    if (!ready || modalOpen()) return;
    const tool = state.tool;
    if (!tool || tool === 'inspect') { if (phase === 'start') inspectAt(tx, ty, tool === 'inspect'); return; }
    if (insp) closeInspector();
    applyTool(tool, tx, ty, phase);
    if (phase === 'end') { clearTimeout(brushTimer); brushTimer = setTimeout(() => { Render.brush = null; }, 350); }
  }

  // ------------------------------------------------------------------ lifecycle
  function init() {
    if (ready) return;
    refs.top = $('top'); refs.topwrap = $('topwrap'); refs.yearVal = $('yearVal'); refs.counters = $('counters'); refs.speeds = $('speeds');
    refs.pausedTag = $('pausedTag'); refs.menuBtn = $('btnMenu'); refs.feed = $('feed'); refs.bottom = $('bottom'); refs.fabs = $('fabs');
    refs.toasts = $('toasts'); refs.sheet = $('sheet'); refs.dock = $('dock'); refs.tabs = $('tabs'); refs.kbar = $('kbar'); refs.tools = $('tools');
    refs.hint = $('hint'); refs.brushbox = $('brushbox'); refs.modals = $('modals');
    loadPrefs();
    document.body.classList.add('ui-on');
    buildTop();
    buildTabs();
    buildBrush();
    buildFabs();
    ready = true;
    selectTab(state.tab);
    Bus.on('log', (e) => { if (ready) { feed.pending.push(e); if (feed.pending.length > 24) feed.pending.splice(0, feed.pending.length - 24); } });
    document.addEventListener('click', (ev) => { const b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if (b && ev.detail > 0) b.blur(); });
    // keyboard shortcuts (desktop testing)
    window.addEventListener('keydown', (ev) => {
      if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
      if (ev.key === 'Escape') { if (modals.length) modals[modals.length - 1].close(); else closeInspector(); }
      else if (ev.key === ' ') { ev.preventDefault(); Main.setSpeed(Main.getSpeed() === 0 ? 1 : 0); }
    });
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => layoutSoon());
      ro.observe(refs.bottom); ro.observe(refs.top);
    }
    window.addEventListener('resize', layoutSoon);
    window.addEventListener('orientationchange', () => { setTimeout(layoutSoon, 250); });
    feed.lastId = S.nextLogId - 1;
    layout();
    updateTop();
    // first-run hint
    setTimeout(() => hintOnce('welcome', 'Выберите силу внизу — или тапните по жителю, чтобы осмотреть его'), 1200);
  }
  function update(dtMs) {
    if (!ready) return;
    const now = performance.now();
    try { flushFeed(now); fadeFeed(now); } catch (e) { /* keep running */ }
    accFast += dtMs; accStats += dtMs; accSlow += dtMs;
    if (accFast >= 250) {
      accFast = 0;
      try {
        if (accStats >= 250) { accStats = 0; Sim.stats(); }
        updateTop();
        updateInspector();
      } catch (e) { reportOnce('ui.fast', e); }
    }
    if (accSlow >= 1000) {
      accSlow = 0;
      try {
        if (state.tab === 'kingdoms') updateChips(false);
        if (logPanel) logPanel.refresh();
        if (statsPanel) statsPanel.refresh();
      } catch (e) { reportOnce('ui.slow', e); }
    }
  }
  const warned = {};
  function reportOnce(k, e) { if (!warned[k]) { warned[k] = 1; console.error(k, e); } }
  function onWorldReplaced() {
    if (!ready) return;
    closeInspector();
    closeAllModals();
    clearFeed();
    feed.lastId = S.nextLogId - 1;
    Render.highlight = null; Render.brush = null;
    chipMap = new Map(); chipSig = '';
    if (state.tab === 'kingdoms') renderKBar();
    dockCache.year = -1; dockCache.kingdoms = -1; dockCache.wars = -1; dockCache.pop = [-1, -1, -1];
    updateTop();
    layoutSoon();
  }

  return {
    init, update, toast, state, handleTap, handlePaint, openInspector, closeInspector, onWorldReplaced,
    // extras
    openMenu, openLog, openWorld, openHelp, selectTab, selectTool, setMode, setBrush, layout, focusVisible, ensureVisible, visibleCenter, bandInfo, modalOpen, closeAllModals,
    get inspector() { return insp ? { type: insp.type, id: insp.id } : null; },
    get ready() { return ready; },
  };
})();


/* ---- 99_main.js ---- */
/* =====================================================================
 * 99_main.js — Main: boot, fixed-step game loop, resize / visibility handling, autosave, error overlay, debug hook.
 * OWNER: UI+Main agent. CONTRACT §4 Main.  Loaded last; the boot call at the bottom runs after every module exists.
 *
 *  - fixed step: accumulator at 1000/(TICKS_PER_SEC*speed) ms per tick, speed in {0,1,2,4}, at most 6 ticks per frame and ~10 ms
 *    of sim time per frame (the backlog is dropped, the game just runs slower on a weak device); Render.draw gets the sub-tick alpha.
 *  - Sim.adaptPerf(frameMs) gets the CPU time of every frame (sim + render + UI).
 *  - autosave: every 60 s real time (only if the world advanced), on visibilitychange->hidden and pagehide.
 *  - window.__god = {S,Sim,World,...,setSpeed,getSpeed,step} for tests.
 * ===================================================================== */

const Main = (() => {
  const SPEEDS = [0, 1, 2, 4];
  const AUTOSAVE_MS = 60000;
  const MAX_TICKS_PER_FRAME = 6, SIM_BUDGET_MS = 10;

  let speed = 1, acc = 0, lastT = 0, rafId = 0, hidden = false, booted = false;
  let lastAutosaveAt = 0, lastAutosaveTick = -1;
  let canvas = null;
  let cssW = 0, cssH = 0, lastDpr = 0;
  const errs = { n: 0, last: '', count: 0 };
  const stats = { frames: 0, ticks: 0, frameMs: 0, simMs: 0 };

  const $ = (id) => document.getElementById(id);

  // ------------------------------------------------------------------ speed
  function setSpeed(s) {
    s = +s;
    if (!(s >= 0)) s = 1;
    if (SPEEDS.indexOf(s) < 0) { // snap to the nearest allowed speed
      let best = 1, bd = 1e9;
      for (const c of SPEEDS) { const d = Math.abs(c - s); if (d < bd) { bd = d; best = c; } }
      s = best;
    }
    speed = s;
    if (s === 0) acc = 0;
    return speed;
  }
  function getSpeed() { return speed; }

  // ------------------------------------------------------------------ viewport
  function measure() {
    const vv = window.visualViewport;
    let w = window.innerWidth, h = window.innerHeight;
    if (vv && vv.scale <= 1.02) { w = vv.width; h = vv.height; }
    return { w: Math.max(200, Math.round(w)), h: Math.max(200, Math.round(h)), dpr: window.devicePixelRatio || 1 };
  }
  function onResize(force) {
    const m = measure();
    const ae = document.activeElement;
    const typing = ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName);
    if (!force && typing && m.w === cssW) return;                  // soft keyboard: keep the map layout stable
    if (!force && m.w === cssW && m.h === cssH && m.dpr === lastDpr) return;
    cssW = m.w; cssH = m.h; lastDpr = m.dpr;
    document.documentElement.style.setProperty('--vh', (m.h * 0.01) + 'px');
    try { Render.resize(m.w, m.h, m.dpr); } catch (e) { console.error('resize', e); }
    if (UI.ready) UI.layout();
  }

  // ------------------------------------------------------------------ camera helpers
  function initialView(instant) {
    if (!S.w) return;
    let tx = S.w / 2, ty = S.h / 2, found = false;
    let bestPop = -1;
    for (const c of S.cities.values()) { if ((c.pop | 0) > bestPop) { bestPop = c.pop | 0; tx = c.x + 0.5; ty = c.y + 0.5; found = true; } }
    if (!found) { for (const u of S.units.values()) { tx = u.x; ty = u.y; found = true; break; } }
    const z = Util.clamp(found ? 9 : 6, Render.minZoom(), Render.maxZoom());
    if (UI.ready) UI.focusVisible(tx, ty, z, instant !== false); else Render.focusOn(tx, ty, z, true);
  }
  function resetView() {
    if (!S.w) return;
    const bi = UI.ready ? UI.bandInfo() : { w: cssW, h: cssH, top: 0, bot: cssH };
    const z = Util.clamp(Math.min(bi.w / S.w, (bi.bot - bi.top) / S.h) * 0.98, Render.minZoom(), Render.maxZoom());
    if (UI.ready) UI.focusVisible(S.w / 2, S.h / 2, z); else Render.focusOn(S.w / 2, S.h / 2, z);
  }
  function focusTile(x, y) {
    const z = Math.max(Render.cam.zoom, 12);
    if (UI.ready) UI.focusVisible(x + 0.5, y + 0.5, z); else Render.focusOn(x + 0.5, y + 0.5, z);
  }

  // ------------------------------------------------------------------ world replacement (new world / load)
  function worldReplaced(kind) {
    acc = 0; lastT = 0;
    lastAutosaveAt = performance.now(); lastAutosaveTick = S.tick;
    try { Input.cancel(); } catch (e) { /* ignore */ }
    try { UI.onWorldReplaced(); } catch (e) { console.error('UI.onWorldReplaced', e); }
    initialView(true);
    Bus.emit('worldReplaced', kind);
  }
  function newWorld(opts) {
    Sim.newWorld(Object.assign({ populate: true }, opts || {}));
    worldReplaced('new');
    return S;
  }

  // ------------------------------------------------------------------ autosave
  function autosave(why) {
    if (!S.tile || S.tick === lastAutosaveTick) { lastAutosaveAt = performance.now(); return false; }
    let ok = false;
    try { ok = Save.save('auto'); } catch (e) { ok = false; }
    lastAutosaveAt = performance.now();
    if (ok) lastAutosaveTick = S.tick;
    return ok;
  }

  // ------------------------------------------------------------------ frame
  function frame(t) {
    rafId = requestAnimationFrame(frame);
    const c0 = performance.now();
    let dt = lastT ? t - lastT : 16.7;
    lastT = t;
    if (!(dt >= 0)) dt = 0;
    if (dt > 250) dt = 250;
    let alpha = 1;
    if (!hidden && speed > 0 && S.tile) {
      const stepMs = 1000 / (Const.TICKS_PER_SEC * speed);
      acc += dt;
      let n = 0;
      const deadline = c0 + SIM_BUDGET_MS;
      while (acc >= stepMs && n < MAX_TICKS_PER_FRAME) {
        Sim.step(); acc -= stepMs; n++;
        if (performance.now() > deadline) break;
      }
      if (acc >= stepMs) acc = stepMs * 0.5;                    // drop the backlog
      stats.ticks += n;
      alpha = acc / stepMs;
      stats.simMs = performance.now() - c0;
    } else if (speed === 0) acc = 0;
    try { Fx.update(dt / 1000); } catch (e) { /* ignore */ }
    try { Render.draw(alpha, t); } catch (e) { reportError(e); }
    try { UI.update(dt); } catch (e) { reportError(e); }
    if (c0 - lastAutosaveAt >= AUTOSAVE_MS) autosave('timer');
    const cpu = performance.now() - c0;
    stats.frames++; stats.frameMs = stats.frameMs ? stats.frameMs * 0.94 + cpu * 0.06 : cpu;
    watchSmoothness(dt, cpu, t);
    try { Sim.adaptPerf(cpu); } catch (e) { /* ignore */ }
  }
  function start() { if (!rafId) { lastT = 0; rafId = requestAnimationFrame(frame); } }
  function stop() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }

  // Compositor-bound slowness (blur panels over the animated canvas) while the JS itself is cheap -> switch the glass off.
  const smooth = { ema: 16.7, slowSince: 0, lite: false };
  function watchSmoothness(dt, cpu, t) {
    if (smooth.lite || hidden || dt <= 0 || dt >= 250) return;
    smooth.ema += (dt - smooth.ema) * 0.05;
    if (smooth.ema > 26 && stats.frameMs < 12) {
      if (!smooth.slowSince) smooth.slowSince = t;
      else if (t - smooth.slowSince > 5000) { smooth.lite = true; document.body.classList.add('lite'); }
    } else smooth.slowSince = 0;
  }

  // ------------------------------------------------------------------ errors
  function showError(msg) {
    errs.n++;
    msg = String(msg || 'Ошибка').slice(0, 220);
    const box = $('errbox');
    if (!box) return;
    if (msg === errs.last) errs.count++; else { errs.last = msg; errs.count = 1; }
    box.innerHTML = '';
    const m = document.createElement('div'); m.className = 'em';
    m.textContent = 'Ошибка: ' + msg + (errs.count > 1 ? '  (×' + errs.count + ')' : '');
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Скрыть');
    x.addEventListener('click', () => { box.hidden = true; errs.last = ''; errs.count = 0; });
    box.appendChild(m); box.appendChild(x);
    box.hidden = false;
  }
  function reportError(e) {
    const msg = e && e.message ? e.message : String(e);
    if (reportError.last !== msg) { reportError.last = msg; console.error('[Main]', e); }
  }

  let guarded = false;
  function installGuards() {
    if (guarded) return;
    guarded = true;
    document.body.classList.add('booting');
    window.addEventListener('error', (ev) => { showError(ev && ev.message ? ev.message : 'Неизвестная ошибка'); });
    window.addEventListener('unhandledrejection', (ev) => { const r = ev && ev.reason; showError(r && r.message ? r.message : String(r)); });
    const oerr = console.error;
    console.error = function () {
      try { oerr.apply(console, arguments); } catch (e) { /* ignore */ }
      try {
        const a = arguments[0];
        let msg = typeof a === 'string' ? a : (a && a.message) || '';
        if (arguments.length > 1 && arguments[1] && arguments[1].message) msg += ' ' + arguments[1].message;
        showError(msg.split('\n')[0]);
      } catch (e) { /* ignore */ }
    };
    // iOS: no page zoom, no scroll / bounce outside the scrollable panels
    const free = 'input,.hscroll,.sh-body,.m-body,.filters';
    document.addEventListener('touchmove', (e) => {
      const t = e.target;
      if (t && t.closest && t.closest(free)) return;
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', (e) => { if (e.cancelable) e.preventDefault(); });
    window.addEventListener('resize', () => onResize(false));
    window.addEventListener('orientationchange', () => { setTimeout(() => onResize(false), 120); setTimeout(() => onResize(false), 500); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => onResize(false));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hidden = true; autosave('hidden'); }
      else { hidden = false; lastT = 0; acc = 0; onResize(false); }
    });
    window.addEventListener('pagehide', () => { autosave('pagehide'); });
    window.addEventListener('pageshow', () => { hidden = document.hidden; lastT = 0; acc = 0; });
  }

  // ------------------------------------------------------------------ debug hook
  function exposeDebug() {
    window.__god = {
      S, Sim, World, Units, Cities, Kingdoms, Diplomacy, War, Powers, Render, Save, UI, Const,
      setSpeed, getSpeed,
      step(n) { n = n === undefined ? 1 : n | 0; for (let i = 0; i < n; i++) Sim.step(); try { Sim.stats(); } catch (e) { /* ignore */ } return S.tick; },
      // extras for tests
      Main, Input, Sprites, Buildings, Fx, Log, Names, Tabs, ToolDefs, Races, Traits, Gear, Util, R, Bus, Tiles,
      stats, get errors() { return errs; },
    };
  }

  // ------------------------------------------------------------------ boot
  function boot() {
    if (booted) return;
    booted = true;
    const msg = $('splashMsg');
    try {
      installGuards();
      Sprites.init();
      let loaded = false;
      try { if (Save.exists('auto')) loaded = Save.load('auto'); } catch (e) { loaded = false; }
      if (!loaded) Sim.newWorld({ populate: true });
      canvas = $('game');
      Render.init(canvas);
      onResize(true);
      Input.init(canvas, { onTap: (x, y) => UI.handleTap(x, y), onPaint: (x, y, p) => UI.handlePaint(x, y, p) });
      UI.init();
      UI.layout();
      initialView(true);
      exposeDebug();
      lastAutosaveAt = performance.now(); lastAutosaveTick = S.tick;
      start();
      requestAnimationFrame(() => {
        const sp = $('splash');
        if (sp) { sp.classList.add('out'); setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); document.body.classList.remove('booting'); }, 600); }
      });
    } catch (e) {
      console.error('boot failed', e);
      if (msg) msg.textContent = 'Не удалось запустить игру: ' + (e && e.message ? e.message : e);
      showError(e && e.message ? e.message : e);
    }
  }

  return {
    boot, guard: installGuards, setSpeed, getSpeed, newWorld, worldReplaced, resetView, focusTile, initialView, autosave, onResize, start, stop,
    get hidden() { return hidden; },
  };
})();

// Boot after the first paint so the "Загрузка…" splash is really visible while the world is generated.
Main.guard();
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => setTimeout(Main.boot, 0));
setTimeout(Main.boot, 400);        // safety net when rAF is throttled (boot is idempotent)

})();</script>
