<!doctype html>
<html lang="ru">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>GODSIM — симулятор бога</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b1630'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%2358c7ff'/%3E%3Cpath d='M3 9c3-3 6 2 10-2v3c-4 4-7-1-10 2z' fill='%2358e08a'/%3E%3C/svg%3E">
<style>/* =====================================================================
 * GODSIM — UI styles. Dark glassy panels, system fonts only, safe-area aware, transform/opacity animations only.
 * ===================================================================== */
:root {
  color-scheme: dark;
  --bg: #060b17;
  --panel: rgba(10, 17, 34, .80);
  --panel-solid: #0c1428;
  --fill: rgba(255, 255, 255, .06);
  --fill2: rgba(255, 255, 255, .11);
  --line: rgba(255, 255, 255, .14);
  --line2: rgba(255, 255, 255, .07);
  --txt: #eaf0ff;
  --dim: #98a8cd;
  --faint: #64739a;
  --acc: #ffca3d;
  --acc-rgb: 255, 202, 61;
  --acc2: #58c7ff;
  --acc2-rgb: 88, 199, 255;
  --good: #58e08a;
  --bad: #ff5b5b;
  --warn: #ff9a3a;
  --human: #4aa3ff;
  --orc: #6fbf3a;
  --elf: #c78bff;
  --r: 14px;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --vh: 1vh;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--txt);
  font: 14px/1.3 var(--font);
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: none;
}
body { position: fixed; inset: 0; }

#game {
  position: fixed; left: 0; top: 0;
  width: 100%; height: 100%;
  display: block;
  background: #07101c;
  touch-action: none;
  outline: none;
}

button {
  font: inherit; color: inherit;
  margin: 0; padding: 0;
  border: 0; background: none;
  -webkit-appearance: none; appearance: none;
  touch-action: manipulation;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:focus { outline: none; }
button:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
canvas.ic { display: block; image-rendering: pixelated; flex: none; }
.hide { display: none !important; }

input, textarea { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }

/* ---------- layers ---------- */
#ui {
  visibility: hidden;                     /* shown by UI.init (body.ui-on): other pages built from the same template stay clean */
  position: fixed; left: 0; top: 0; width: 100%;
  height: 100vh; height: calc(var(--vh, 1vh) * 100);
  pointer-events: none;
  overflow: hidden;
}
@supports (height: 100dvh) { #ui { height: 100dvh; } }
body.ui-on #ui { visibility: visible; }
.hit { pointer-events: auto; }

#shade-top {
  position: absolute; left: 0; right: 0; top: 0;
  height: calc(var(--st) + 28px);
  background: linear-gradient(rgba(3, 6, 14, .55), rgba(3, 6, 14, 0));
}
#paintframe {
  position: absolute; inset: 0;
  border-radius: 0;
  box-shadow: inset 0 0 0 3px rgba(var(--acc2-rgb), .0), inset 0 0 38px rgba(var(--acc2-rgb), .0);
  opacity: 0;
  transition: opacity .2s ease;
}
body.paint #paintframe {
  opacity: 1;
  box-shadow: inset 0 0 0 2px rgba(var(--acc2-rgb), .55), inset 0 0 34px rgba(var(--acc2-rgb), .22);
}

.glass {
  background: var(--panel-solid);
  border: 1px solid var(--line);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
}
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass {
    background: var(--panel);
    -webkit-backdrop-filter: blur(10px) saturate(1.25);
    backdrop-filter: blur(10px) saturate(1.25);
  }
}

/* ---------- top bar ---------- */
#topwrap {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(var(--st) + 6px) max(8px, var(--sr)) 0 max(8px, var(--sl));
  pointer-events: none;
}
#top {
  border-radius: var(--r);
  padding: 4px 6px;
  display: flex; flex-direction: column; gap: 2px;
}
.top-row { display: flex; align-items: center; gap: 6px; min-height: 38px; }
.top-ctl { min-height: 52px; }
.year { display: flex; align-items: baseline; gap: 5px; padding-left: 4px; white-space: nowrap; }
.year span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.year b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.counters { margin-left: auto; display: flex; align-items: center; gap: 1px; padding: 2px 2px; border-radius: 10px; min-height: 38px; }
.counters:active { background: var(--fill); }
.cnt { display: flex; align-items: center; gap: 4px; padding: 0 6px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cnt.sep { margin-left: 4px; padding-left: 9px; border-left: 1px solid var(--line); }
.cnt.war { color: var(--bad); }
.cnt.k { color: #ffd76a; }
.cnt.pop-0 { color: var(--human); }
.cnt.pop-1 { color: var(--orc); }
.cnt.pop-2 { color: var(--elf); }

.seg { display: flex; gap: 3px; padding: 3px; border-radius: 13px; background: rgba(0, 0, 0, .28); border: 1px solid var(--line2); }
.seg button {
  width: 48px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s ease, transform .1s ease, box-shadow .15s ease;
}
.seg button:active { transform: scale(.93); }
.seg button.on {
  background: linear-gradient(rgba(var(--acc-rgb), .30), rgba(var(--acc-rgb), .14));
  box-shadow: 0 0 0 1px rgba(var(--acc-rgb), .75), 0 0 12px rgba(var(--acc-rgb), .35);
}
.seg button.pause.on {
  background: linear-gradient(rgba(255, 138, 60, .34), rgba(255, 138, 60, .16));
  box-shadow: 0 0 0 1px rgba(255, 150, 70, .85), 0 0 12px rgba(255, 138, 60, .4);
}
.paused-tag {
  flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden;
  font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #ffb066;
  opacity: 0; transition: opacity .2s ease;
}
body.is-paused .paused-tag { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.ibtn {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--fill); border: 1px solid var(--line2);
  transition: transform .1s ease, background .12s ease;
}
.ibtn:active { transform: scale(.92); background: var(--fill2); }
.top-ctl .ibtn { margin-left: auto; }
.paused-tag + .ibtn { margin-left: 0; }

/* ---------- event feed ---------- */
#feed { margin-top: 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; pointer-events: none; max-width: 100%; }
.fl {
  pointer-events: auto;
  display: flex; align-items: flex-start; gap: 7px;
  max-width: 100%;
  padding: 4px 10px 4px 8px;
  border-radius: 11px;
  background: rgba(8, 13, 28, .74);
  border: 1px solid var(--line2);
  font-size: 12.5px; line-height: 1.25;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .7);
  text-align: left;
  opacity: 0; transform: translateY(-6px);
  animation: fl-in .22s ease-out forwards;
  transition: opacity .9s ease;
  touch-action: manipulation;
}
.fl i { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; box-shadow: 0 0 6px currentColor; background: currentColor; }
.fl span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; word-break: break-word; }
.fl.big span { -webkit-line-clamp: 2; }
.fl.fade { opacity: 0 !important; animation: none; }
.fl.go { cursor: pointer; }
@keyframes fl-in { to { opacity: 1; transform: none; } }

/* ---------- bottom: dock, fabs, toasts ---------- */
#bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  display: flex; flex-direction: column; justify-content: flex-end;
}
#dock {
  border-radius: 20px 20px 0 0;
  border-bottom: 0;
  padding: 0 max(6px, var(--sr)) 0 max(6px, var(--sl));
}
#bottom.sheet-open #dock { display: none; }
#bottom:not(.sheet-open) #sheet { display: none; }

#tabs { display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 4px; }
.tab {
  position: relative;
  height: 46px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  color: var(--dim); font-size: 10px; font-weight: 600; letter-spacing: .01em;
  transition: color .15s ease, background .15s ease;
}
.tab canvas { opacity: .7; transition: opacity .15s ease, transform .15s ease; }
.tab:active { background: var(--fill); }
.tab.on { color: var(--acc); }
.tab.on canvas { opacity: 1; transform: translateY(-1px) scale(1.06); }
.tab.on::after {
  content: ""; position: absolute; left: 24%; right: 24%; top: -1px; height: 3px; border-radius: 0 0 3px 3px;
  background: var(--acc); box-shadow: 0 0 10px rgba(var(--acc-rgb), .8);
}
.tab .dot { position: absolute; top: 5px; right: calc(50% - 22px); width: 7px; height: 7px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 6px var(--bad); }

.hscroll {
  display: flex; align-items: stretch; gap: 6px;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  touch-action: pan-x;
  scrollbar-width: none;
}
.hscroll::-webkit-scrollbar { display: none; }

#tools { padding: 5px 14px 4px 14px; margin: 0 -6px; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 18px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 18px), transparent 100%); }
#tools::after { content: ""; flex: none; width: 6px; }
.tool {
  position: relative; flex: none;
  width: 60px; height: 58px; border-radius: 13px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--fill);
  border: 1px solid var(--line2);
  color: var(--dim); font-size: 10px; font-weight: 600; letter-spacing: 0;
  white-space: nowrap;
  transition: transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.tool canvas { transition: transform .15s ease; }
.tool:active { transform: scale(.93); }
.tool.on {
  color: #fff;
  border-color: rgba(var(--acc-rgb), .9);
  background: linear-gradient(rgba(var(--acc-rgb), .26), rgba(var(--acc-rgb), .10));
  box-shadow: 0 0 0 1px rgba(var(--acc-rgb), .55), 0 0 16px rgba(var(--acc-rgb), .42);
}
.tool.on canvas { transform: scale(1.1); }
.tool .badge { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc2); opacity: .8; }
.tool.act { color: var(--txt); }
.grp { flex: none; display: flex; gap: 6px; align-items: stretch; }
.grp-lbl {
  position: relative; flex: none; width: 15px; margin: -4px 0 -3px 2px; align-self: stretch;
  border-right: 1px solid var(--line2);
}
.grp-lbl span {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%) rotate(-90deg);
  white-space: nowrap;
  font-size: 8.5px; font-weight: 700; letter-spacing: -.02em; color: var(--faint);
}
.grp:first-child .grp-lbl { margin-left: 0; }

#kbar { padding: 6px 14px 0 14px; margin: 0 -6px; min-height: 0; }
#kbar:empty { display: none; }
#kbar::after { content: ""; flex: none; width: 6px; }
.kchip {
  flex: none; display: flex; align-items: center; gap: 7px;
  height: 44px; padding: 0 11px 0 7px; border-radius: 12px;
  background: var(--fill); border: 1px solid var(--line2);
  border-left: 4px solid var(--kc, var(--line));
  max-width: 190px;
  transition: transform .1s ease, background .12s ease;
}
.kchip:active { transform: scale(.95); background: var(--fill2); }
.kchip .kn { display: flex; flex-direction: column; min-width: 0; text-align: left; }
.kchip .kn b { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 112px; }
.kchip .kn small { font-size: 10.5px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.kchip .kn small u { text-decoration: none; color: var(--bad); font-weight: 700; }
.kempty { flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; color: var(--faint); font-size: 12px; }

#ctx {
  display: flex; align-items: center; gap: 8px;
  min-height: 46px;
  padding: 2px 6px calc(var(--sb) + 4px) 6px;
}
#hint { flex: 1; min-width: 0; font-size: 12px; line-height: 1.25; color: var(--dim); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
#hint b { color: var(--txt); font-weight: 700; }
#brushbox { flex: none; display: flex; align-items: center; gap: 2px; }
#brushbox.hide { display: none; }
.step {
  width: 44px; height: 44px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  background: var(--fill); border: 1px solid var(--line2);
  transition: transform .1s ease, background .12s ease;
}
.step:active { transform: scale(.9); background: var(--fill2); }
.step:disabled { opacity: .35; }
.bval {
  min-width: 34px; height: 30px; padding: 0 6px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 14px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums;
}
.bval i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--acc); flex: none; }
input[type=range].slider {
  -webkit-appearance: none; appearance: none;
  width: 96px; height: 44px; margin: 0 2px; padding: 0;
  background: transparent; touch-action: pan-y;
}
input[type=range].slider::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--acc) var(--p, 30%), rgba(255, 255, 255, .16) var(--p, 30%)); }
input[type=range].slider::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .16); }
input[type=range].slider::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--acc); }
input[type=range].slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; margin-top: -10px; border-radius: 50%;
  background: #fff; border: 3px solid var(--acc); box-shadow: 0 1px 6px rgba(0, 0, 0, .5);
}
input[type=range].slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--acc); }

/* floating buttons */
#fabs {
  position: absolute; right: max(10px, var(--sr)); bottom: calc(100% + 10px);
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  pointer-events: none;
}
.fab, .zoom {
  pointer-events: auto;
  background: rgba(10, 17, 34, .82);
  border: 1px solid var(--line);
  box-shadow: 0 3px 12px rgba(0, 0, 0, .4);
}
.fab {
  width: 50px; height: 50px; border-radius: 15px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  font-size: 8.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--dim);
  transition: transform .1s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
}
.fab:active { transform: scale(.92); }
.fab canvas { margin-bottom: 1px; }
.fab.on {
  color: #fff;
  border-color: rgba(var(--acc2-rgb), .95);
  background: linear-gradient(rgba(var(--acc2-rgb), .34), rgba(var(--acc2-rgb), .14));
  box-shadow: 0 0 0 1px rgba(var(--acc2-rgb), .6), 0 0 18px rgba(var(--acc2-rgb), .5);
}
.zoom { width: 50px; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; }
.zoom button { height: 48px; display: flex; align-items: center; justify-content: center; transition: background .12s ease; }
.zoom button:active { background: var(--fill2); }
.zoom button + button { border-top: 1px solid var(--line2); }

#toasts {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 12px);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none; padding: 0 max(76px, var(--sr));
}
.toast {
  max-width: 100%;
  padding: 9px 15px; border-radius: 13px;
  background: rgba(10, 17, 34, .92);
  border: 1px solid var(--line);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
  font-size: 13px; line-height: 1.3; text-align: center;
  opacity: 0; transform: translateY(8px) scale(.97);
  animation: toast-in .2s ease-out forwards;
  transition: opacity .35s ease, transform .35s ease;
}
.toast.bad { border-color: rgba(255, 91, 91, .6); }
.toast.good { border-color: rgba(88, 224, 138, .55); }
.toast.out { opacity: 0 !important; transform: translateY(-6px); animation: none; }
@keyframes toast-in { to { opacity: 1; transform: none; } }

/* ---------- inspector sheet ---------- */
#sheet {
  pointer-events: auto;
  border-radius: 20px 20px 0 0; border-bottom: 0;
  max-height: 55vh; max-height: calc(var(--vh, 1vh) * 55);
  display: flex; flex-direction: column;
  padding: 0 max(0px, var(--sr)) 0 max(0px, var(--sl));
  animation: sheet-in .24s cubic-bezier(.2, .8, .3, 1);
}
@keyframes sheet-in { from { transform: translateY(36px); opacity: 0; } to { transform: none; opacity: 1; } }
.sh-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 8px 7px 12px; border-bottom: 1px solid var(--line2); min-height: 62px; }
.sh-ava { flex: none; width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.sh-ava canvas { image-rendering: pixelated; }
.sh-title { flex: 1; min-width: 0; }
.sh-title b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-size: 16px; font-weight: 800; line-height: 1.15; overflow: hidden; word-break: break-word; }
.sh-title small { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.sh-btn { flex: none; min-width: 48px; height: 48px; border-radius: 12px; background: var(--fill); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 10px; font-size: 12px; font-weight: 700; color: var(--txt); transition: transform .1s ease, background .12s ease; }
.sh-btn:active { transform: scale(.93); background: var(--fill2); }
.sh-btn.primary { background: rgba(var(--acc2-rgb), .16); border-color: rgba(var(--acc2-rgb), .55); color: #cfeeff; }
.sh-btn .t { display: none; }
@media (min-width: 420px) { .sh-btn .t { display: inline; } }
.sh-body {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
  padding: 8px 12px calc(var(--sb) + 12px) 12px;
}
.sh-body.dead { opacity: .55; }
.sec { margin-top: 10px; }
.sec:first-child { margin-top: 0; }
.sec-h { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 5px; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 26px; font-size: 13px; border-bottom: 1px solid var(--line2); padding: 2px 0; }
.kv:last-child { border-bottom: 0; }
.kv > span:first-child { color: var(--dim); flex: none; }
.kv > .v { text-align: right; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; font-weight: 600; }
.bars { display: grid; gap: 5px; }
.bar { position: relative; display: flex; align-items: center; gap: 8px; font-size: 12px; }
.bar > label { flex: none; width: 90px; color: var(--dim); white-space: nowrap; }
.bar .track { position: relative; flex: 1; height: 17px; border-radius: 6px; background: rgba(255, 255, 255, .08); overflow: hidden; border: 1px solid var(--line2); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform: scaleX(0); transform-origin: 0 50%; border-radius: 5px; background: var(--c, var(--good)); transition: transform .25s ease, background-color .25s ease; }
.bar.mid .fill { width: 0; transform: none; transition: background-color .25s ease; }

<script>(function(){
'use strict';
/* ---- 00_core.js ---- */
/* =====================================================================
 * 00_core.js — constants, RNG, event bus, log, FX queue, global state S
 * OWNER: architect. Other modules must NOT edit this file (see docs/CONTRACT.md).
 * ===================================================================== */

const Const = (() => {
  const T = { DEEP: 0, SHALLOW: 1, SAND: 2, GRASS: 3, FOREST: 4, HILL: 5, MOUNTAIN: 6, SNOW: 7, LAVA: 8 };
  return {
    TICKS_PER_SEC: 10,
    TICKS_PER_YEAR: 60,      // 1 world year = 6 s at x1
    START_YEAR: 1,
    DEFAULT_W: 96,
    DEFAULT_H: 96,
    TILE_PX: 16,             // native sprite / atlas tile size in pixels
    MAX_UNITS: 1500,
    CITY_MIN_DIST: 10,       // min distance between city centers (tiles)
    T,                       // tile ids
    TILE_COUNT: 9,
    RACE: { HUMAN: 0, ORC: 1, ELF: 2 },
    RACE_COUNT: 3,
    SEX: { M: 0, F: 1 },
    // resource kinds living in S.res (FOREST tiles hold wood implicitly)
    RES: { NONE: 0, TREE: 1, ROCK: 2, IRON: 3, GOLD: 4, BERRY: 5, FISH: 6 /* virtual: land tile next to shallow water */ },
    // building types
    B: { HOUSE: 1, FARM: 2, STORAGE: 3, BARRACKS: 4, TOWNHALL: 5, TEMPLE: 6, MARKET: 7 },
    BUILDING_TYPES: [1, 2, 3, 4, 5, 6, 7],
    GOODS: ['food', 'wood', 'stone', 'iron', 'gold'],
    // diplomacy relation state
    REL: { PEACE: 0, ALLIANCE: 1, WAR: 2 },
    // map render modes
    MODE: { NORMAL: 0, BORDERS: 1 /* political: region owners/controllers, fronts */, CULTURE: 2 },
    // army orders (HOI4-style)
    ORDER: { ATTACK: 'attack', HOLD: 'hold', DEFEND: 'defend', RETREAT: 'retreat' },
    REGION_SPACING: 10,      // target distance between region seeds (tiles) -> ~60-90 tiles per region
    // unit AI states (strings, JSON-safe). UI maps them to Russian labels.
    STATES: ['idle', 'wander', 'walk', 'gather', 'carry', 'build', 'farm', 'eat', 'sleep', 'flee', 'fight', 'army', 'mate', 'settle'],
    // log kinds (feed colors in UI)
    LOG: { INFO: 'info', WAR: 'war', PEACE: 'peace', BIRTH: 'birth', DEATH: 'death', DISASTER: 'disaster', CITY: 'city', KINGDOM: 'kingdom', REBEL: 'rebel', GOD: 'god' },
    SAVE_VERSION: 1,
  };
})();

/* ---------- Seeded RNG (mulberry32). State is saved with the world. ---------- */
const R = (() => {
  let s = 1;
  function next() {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    seed(n) { s = (n | 0) || 1; },
    getState() { return s; },
    setState(v) { s = v | 0; },
    f: next,                                         // [0,1)
    i(n) { return (next() * n) | 0; },               // int in [0,n)
    int(a, b) { return a + ((next() * (b - a + 1)) | 0); },   // int in [a,b] inclusive
    between(a, b) { return a + next() * (b - a); },  // float in [a,b)
    chance(p) { return next() < p; },
    pick(arr) { return arr[(next() * arr.length) | 0]; },
    gauss() { return (next() + next() + next() + next() - 2) * 0.8660254; }, // ~N(0,~0.58)... bell-ish in [-1.7,1.7]
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = (next() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
  };
})();

/* ---------- Utilities ---------- */
const Util = (() => {
  return {
    clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
    lerp(a, b, t) { return a + (b - a) * t; },
    dist(x0, y0, x1, y1) { const dx = x1 - x0, dy = y1 - y0; return Math.sqrt(dx * dx + dy * dy); },
    dist2(x0, y0, x1, y1) { const dx = x1 - x0, dy = y1 - y0; return dx * dx + dy * dy; },
    cheb(x0, y0, x1, y1) { return Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)); },
    manh(x0, y0, x1, y1) { return Math.abs(x1 - x0) + Math.abs(y1 - y0); },
    /** current world year (integer, starts at Const.START_YEAR) */
    year() { return Const.START_YEAR + Math.floor(S.tick / Const.TICKS_PER_YEAR); },
    /** age in years (float) of anything having `born` (tick). */
    age(e) { return (S.tick - e.born) / Const.TICKS_PER_YEAR; },
    /** deterministic hash of 2 ints -> uint32 (for per-tile visual variants etc.) */
    hash2(x, y, seed) {
      let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 2147483647);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return (h ^ (h >>> 16)) >>> 0;
    },
    hsl(h, s, l) { return `hsl(${h | 0},${s | 0}%,${l | 0}%)`; },
    /** 'rgb' array [r,g,b] -> '#rrggbb' */
    hex(rgb) { return '#' + rgb.map(v => (v | 0).toString(16).padStart(2, '0')).join(''); },
    plural(n, one, few, many) {            // Russian plural: 1 год, 2 года, 5 лет
      n = Math.abs(n) % 100; const n1 = n % 10;
      if (n > 10 && n < 20) return many;
      if (n1 > 1 && n1 < 5) return few;
      if (n1 === 1) return one;
      return many;
    },
  };
})();

/* ---------- Event bus (synchronous) ---------- */
const Bus = (() => {
  const m = new Map();
  return {
    on(ev, fn) { let a = m.get(ev); if (!a) { a = []; m.set(ev, a); } a.push(fn); return fn; },
    off(ev, fn) { const a = m.get(ev); if (!a) return; const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); },
    emit(ev, a, b, c, d) { const l = m.get(ev); if (!l) return; for (let i = 0; i < l.length; i++) { try { l[i](a, b, c, d); } catch (e) { if (typeof console !== 'undefined') console.error('Bus handler error', ev, e); } } },
    clear() { m.clear(); },
  };
})();

/* ---------- Event feed ("лента событий") ---------- */
const Log = {
  /** Log.add('Королевство «Аран» объявило войну «Дорвену»', Const.LOG.WAR, x, y, kingdomId) */
  add(msg, kind, x, y, kid) {
    const e = { id: S.nextLogId++, tick: S.tick, year: Util.year(), msg, kind: kind || 'info', x: x === undefined ? -1 : x, y: y === undefined ? -1 : y, kid: kid || 0 };
    S.log.push(e);
    if (S.log.length > 300) S.log.splice(0, S.log.length - 300);
    Bus.emit('log', e);
    return e;
  },
};

/* ---------- Entity history helper ("история" in the inspector) ---------- */
const Hist = {
  add(ent, text) {
    if (!ent) return;
    if (!ent.hist) ent.hist = [];
    ent.hist.push({ y: Util.year(), t: text });
    if (ent.hist.length > 24) ent.hist.shift();
  },
};

/* ---------- Visual effect queue (data only; Render draws it, real-time seconds) ---------- */
const Fx = {
  list: [],
  /** types: 'lightning','explosion','fire','smoke','heal','bless','plague','quake','dust','spark','splash','blood','rain_drop','whisper','ash'
   *  opts: {ttl (sec, default 0.8), r (radius tiles), color, dx, dy, n, ...}. x,y in float tile coords. */
  add(type, x, y, opts) {
    if (this.list.length > 400) return null;
    const f = Object.assign({ type, x, y, ttl: 0.8, age: 0 }, opts || {});
    this.list.push(f);
    return f;
  },
  /** advance real-time by dt seconds, drop expired. Called once per rendered frame by Main. */
  update(dt) {
    const l = this.list;
    let w = 0;
    for (let i = 0; i < l.length; i++) { const f = l[i]; f.age += dt; if (f.age < f.ttl) l[w++] = f; }
    l.length = w;
  },
  clear() { this.list.length = 0; },
};

/* ---------- Global mutable game state ---------- */
const S = {
  w: 0, h: 0, seed: 1, tick: 0,
  // ---- terrain layers (length w*h, index = y*w + x) ----
  tile: null,   // Uint8Array  Const.T ids
  elev: null,   // Uint8Array  0..255 height (shading + raise/lower)
  res: null,    // Uint8Array  Const.RES kind on tile (0 none). FOREST tiles are implicitly wood.
  amt: null,    // Uint8Array  remaining amount of the resource (FOREST: wood density 1..255)
  owner: null,  // Int32Array  city id owning the tile (0 none)
  bld: null,    // Int32Array  building id on tile (0 none)
  fire: null,   // Uint8Array  remaining burn ticks (0 none)
  region: null, // Int32Array  region id of every LAND tile (0 = water / unassigned). Owned by Regions.
  // ---- render dirty tracking (see S.markDirty) ----
  dirty: null, dirtyList: [], allDirty: true,
  ownerVer: 0,    // bump when S.owner or city→kingdom/culture mapping changes (border overlay rebuild)
  regionVer: 0,   // bump when region owner/controller/claims/goals change (political overlay rebuild) — use S.touchRegions()
  landDirty: true, // landmass labels need recompute (World)
  // ---- entities (all JSON-safe plain objects; refer to each other by id) ----
  units: new Map(), cities: new Map(), kingdoms: new Map(), buildings: new Map(), armies: new Map(), wars: new Map(),
  rels: new Map(),       // diplomacy: key "a_b" (a<b) -> relation object (Diplomacy owns format)
  cultures: [],          // [{id,name,color:'#rrggbb',race}] (Kingdoms owns)
  nextId: 1, nextLogId: 1,
  log: [],               // event feed entries (see Log.add)
  eff: { meteors: [], tornados: [], rains: [], quakes: [] },   // persistent god-power effects (Powers owns; Render draws)
  mod: {},               // per-module persistent scratch: S.mod.units = {...} (JSON-safe, saved automatically)
  stats: { year: 1, pop: [0, 0, 0], popTotal: 0, kingdoms: 0, cities: 0, wars: 0, buildings: 0 },
  perf: { thinkEvery: 3, lod: 0, unitCap: Const.MAX_UNITS, stepMs: 0 }, // Sim updates; Units must respect

  reset(w, h, seed) {
    this.w = w | 0; this.h = h | 0; this.seed = (seed | 0) || 1; this.tick = 0;
    const n = this.w * this.h;
    this.tile = new Uint8Array(n); this.elev = new Uint8Array(n);
    this.res = new Uint8Array(n); this.amt = new Uint8Array(n);
    this.owner = new Int32Array(n); this.bld = new Int32Array(n); this.fire = new Uint8Array(n);
    this.region = new Int32Array(n); this.regions = new Map(); this.regionVer = 1;
    this.dirty = new Uint8Array(n); this.dirtyList = []; this.allDirty = true; this.ownerVer = 1; this.landDirty = true;
    this.units = new Map(); this.cities = new Map(); this.kingdoms = new Map(); this.buildings = new Map();
    this.armies = new Map(); this.wars = new Map(); this.rels = new Map();
    this.cultures = []; this.nextId = 1; this.nextLogId = 1; this.log = [];
    this.eff = { meteors: [], tornados: [], rains: [], quakes: [] };
    this.mod = {};
    this.stats = { year: Const.START_YEAR, pop: [0, 0, 0], popTotal: 0, kingdoms: 0, cities: 0, wars: 0, buildings: 0 };
    this.perf = { thinkEvery: 3, lod: 0, unitCap: Const.MAX_UNITS, stepMs: 0 };
    Fx.clear();
    R.seed(this.seed);
  },
  /** new unique id (shared counter for units/cities/kingdoms/buildings/armies/wars) */
  id() { return this.nextId++; },
  idx(x, y) { return y * this.w + x; },
  inBounds(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; },
  /** flag a tile for re-baking in the terrain cache. Safe to call anywhere (x,y ints, bounds-checked). */
  markDirty(x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const i = y * this.w + x;
    if (!this.dirty[i]) { this.dirty[i] = 1; this.dirtyList.push(i); }
  },
  /** call after changing S.owner / city ownership / culture so the border overlay is rebuilt */
  touchOwner() { this.ownerVer++; },
  /** call after any change of region owner / controller / claims / war goals (also bumps ownerVer) */
  touchRegions() { this.regionVer++; this.ownerVer++; },
};

const Tiles = (() => {
  const T = Const.T;
  const defs = [];
  function def(id, key, name, o) { defs[id] = Object.assign({ id, key, name }, o); }

  // elev: [lo, hi) height band used when terrain is derived from S.elev; mid = representative height
  // speed: walking speed multiplier (0 = impassable); build: buildings allowed; fert: farm/forage fertility 0..1
  // flam: fire spread chance factor 0..1; color: average RGB (minimap / fallback)
  def(T.DEEP,     'deep',     'Глубокая вода', { color: [18, 54, 112],  lo: 0,   hi: 70,  mid: 40,  water: true,  speed: 0,    build: false, fert: 0,   flam: 0 });
  def(T.SHALLOW,  'shallow',  'Мелководье',    { color: [46, 120, 190], lo: 70,  hi: 100, mid: 86,  water: true,  speed: 0.45, build: false, fert: 0,   flam: 0 });
  def(T.SAND,     'sand',     'Песок',         { color: [222, 205, 140], lo: 100, hi: 112, mid: 106, water: false, speed: 0.85, build: true,  fert: 0.1, flam: 0 });
  def(T.GRASS,    'grass',    'Трава',         { color: [88, 160, 62],  lo: 112, hi: 160, mid: 134, water: false, speed: 1,    build: true,  fert: 1,   flam: 0.22 });
  def(T.FOREST,   'forest',   'Лес',           { color: [38, 104, 48],  lo: 112, hi: 160, mid: 136, water: false, speed: 0.6,  build: false, fert: 0.5, flam: 1 });
  def(T.HILL,     'hill',     'Холмы',         { color: [140, 128, 84], lo: 160, hi: 192, mid: 176, water: false, speed: 0.7,  build: true,  fert: 0.3, flam: 0.08 });
  def(T.MOUNTAIN, 'mountain', 'Горы',          { color: [112, 108, 108], lo: 192, hi: 228, mid: 210, water: false, speed: 0.35, build: false, fert: 0,   flam: 0 });
  def(T.SNOW,     'snow',     'Снег',          { color: [236, 242, 250], lo: 228, hi: 256, mid: 242, water: false, speed: 0.5,  build: false, fert: 0,   flam: 0 });
  def(T.LAVA,     'lava',     'Лава',          { color: [226, 84, 24],  lo: 192, hi: 228, mid: 200, water: false, speed: 0,    build: false, fert: 0,   flam: 0, lava: true });

  /** Terrain implied by a height value (never returns FOREST / LAVA). */
  function fromElev(e) {
    if (e < 70) return T.DEEP;
    if (e < 100) return T.SHALLOW;
    if (e < 112) return T.SAND;
    if (e < 160) return T.GRASS;
    if (e < 192) return T.HILL;
    if (e < 228) return T.MOUNTAIN;
    return T.SNOW;
  }

  return {
    defs,
    def(t) { return defs[t]; },
    fromElev,
    midElev(t) { return defs[t].mid; },
    isWater(t) { return t === T.DEEP || t === T.SHALLOW; },
    isLand(t) { return t !== T.DEEP && t !== T.SHALLOW && t !== T.LAVA; },
    /** generic walkability (race-specific cost lives in World.moveCost) */
    walkable(t) { return defs[t].speed > 0; },
    buildable(t) { return defs[t].build; },
  };
})();

    { key: 'lazy',        name: 'Ленивый',        work: 0.75 },
    { key: 'diligent',    name: 'Трудолюбивый',   work: 1.25 },
    { key: 'fertile',     name: 'Плодовитый',     fertility: 1.4 },
    { key: 'sickly',      name: 'Болезненный',    hp: 0.8, sick: 1.5 },
    { key: 'charismatic', name: 'Харизматичный',  loyalty: 10 },
    { key: 'cruel',       name: 'Жестокий',       loyalty: -10, war: 0.1 },
    { key: 'kind',        name: 'Добрый',         loyalty: 8, peace: 0.1 },
    { key: 'fast',        name: 'Быстрый',        speed: 1.2 },
    { key: 'curious',     name: 'Любознательный', xp: 1.15 },
  ];
  const byKey = {};
  list.forEach((t, i) => { t.id = i; byKey[t.key] = t; });
  return {
    list, byKey,
    get(id) { return list[id]; },
    /** product of multiplicative modifiers `key` over unit/ruler traits (u.traits = [ids]) */
    mul(u, key) { let m = 1; const a = u.traits; if (a) for (let i = 0; i < a.length; i++) { const v = list[a[i]][key]; if (v !== undefined) m *= v; } return m; },
    /** sum of additive modifiers `key` */
    sum(u, key) { let m = 0; const a = u.traits; if (a) for (let i = 0; i < a.length; i++) { const v = list[a[i]][key]; if (v !== undefined) m += v; } return m; },
    has(u, key) { const a = u.traits; if (!a) return false; const id = byKey[key].id; return a.indexOf(id) >= 0; },
    /** pick 2-3 distinct random trait ids, avoiding contradictory pairs. Uses R. */
    roll() {
      const n = R.chance(0.45) ? 3 : 2;
      const bad = [[0, 1], [4, 5], [7, 8]];
      const out = [];
      let guard = 0;
      while (out.length < n && guard++ < 30) {
        const id = R.i(list.length);
        if (out.indexOf(id) >= 0) continue;
        if (bad.some(p => (p[0] === id && out.indexOf(p[1]) >= 0) || (p[1] === id && out.indexOf(p[0]) >= 0))) continue;
        out.push(id);
      }
      return out;
    },
  };
})();

  };
  const KEYS = ['human', 'orc', 'elf'];
  const TITLES = ['Королевство', 'Орда', 'Лесное княжество'];

  function used() { const m = S.mod.names || (S.mod.names = { used: {} }); return m.used; }

        n = make(p.pA, p.pB);

    ref(ent) { return ent ? '«' + ent.name + '»' : '«?»'; },

    cityWord(pop) { return pop < 8 ? 'Деревня' : pop < 25 ? 'Посёлок' : pop < 60 ? 'Город' : 'Крупный город'; },
    /** Russian unit title: "Король"/"Королева"/"Вождь"/"Вожак"/"Князь"/"Княгиня" */
    ruler(race, sex) {
      if (race === Const.RACE.ORC) return sex === Const.SEX.F ? 'Вождиха' : 'Вождь';
      if (race === Const.RACE.ELF) return sex === Const.SEX.F ? 'Княгиня' : 'Князь';
      return sex === Const.SEX.F ? 'Королева' : 'Король';
    },
  };
})();

/* =====================================================================
 * 04_world.js — World: terrain generation, god brushes, growth, fire, lava, land labels, pathfinding
 * OWNER: World agent. API: docs/CONTRACT.md §3 World.
 *
 * Notes / conventions
 *  - All gameplay randomness goes through R (brush dithering, growth, fire). Terrain generation uses a private
 *    seeded PRNG + own noise so it never consumes R.
 *  - findNearestRes / randomLand predicates are called as pred(x, y).
 *  - S.landDirty is owned by World: it is set whenever walkability of any tile changes and cleared by the relabel.
 *  - Depleted BERRY bushes stay on the map (S.res = BERRY, S.amt = 0) and regrow; depleted ore is removed.
 *  - Extra helpers: nearestWalkable, inBounds, forestShare, landSize, brushCount (see return object).
 * ===================================================================== */

const World = (() => {
  const T = Const.T, RES = Const.RES;
  const NT = Const.TILE_COUNT;
  const defs = Tiles.defs;

  // ------------------------------------------------------------------ static tile tables
  const SPEED = new Float32Array(NT), FLAM = new Float32Array(NT);
  const WALK = new Uint8Array(NT), ISWATER = new Uint8Array(NT), BUILD = new Uint8Array(NT), ISLANDT = new Uint8Array(NT);
  for (let t = 0; t < NT; t++) {
    const d = defs[t];
    SPEED[t] = d.speed; FLAM[t] = d.flam;
    WALK[t] = d.speed > 0 ? 1 : 0; ISWATER[t] = d.water ? 1 : 0; BUILD[t] = d.build ? 1 : 0;
    ISLANDT[t] = (t !== T.DEEP && t !== T.SHALLOW && t !== T.LAVA) ? 1 : 0;
  }
  // which resource kinds may live on which tile type (index t*8+kind)
  const RES_OK = new Uint8Array(NT * 8);
  (function () {
    const allow = (t, ks) => { for (let i = 0; i < ks.length; i++) RES_OK[t * 8 + ks[i]] = 1; };
    allow(T.GRASS, [RES.TREE, RES.ROCK, RES.IRON, RES.GOLD, RES.BERRY]);
    allow(T.HILL, [RES.ROCK, RES.IRON, RES.GOLD]);
    allow(T.MOUNTAIN, [RES.ROCK, RES.IRON, RES.GOLD]);
  })();

  // ------------------------------------------------------------------ tunables
  const FIRE_SPREAD = 0.07;        // per burning tile, per tick, per 4-neighbour, times neighbour flammability
  const FOREST_MAX_SHARE = 0.30;   // forests stop spreading when they cover this share of all land
  const FOREST_DENSITY_CAP = 0.70; // local (7x7) density at which spreading stops
  const PATH_WEIGHT = 1.5;         // A* heuristic weight (1 = optimal, slower on twisty terrain)
  const LAVA_HILL_P = 10 / 3000;   // per lava check (every 10 ticks) => avg ~3000 ticks to solidify

  // ------------------------------------------------------------------ private caches (rebuilt in initCaches)
  let cKey = null;                 // the S.tile array the caches belong to
  let W = 0, Hh = 0, NN = 0;
  let fireList = null, fireN = 0, inFire = null;
  let lavaList = null, lavaN = 0;
  let lbl = null, lblSizes = [0], lblCount = 0, lastRelabel = -999;
  let stack = null;                // Int32Array scratch (flood fill)
  let scr = null, scrN = 0;        // Int32Array scratch (brush bookkeeping)
  let pg = null, pPar = null, pStamp = null, pGen = 0;
  let hK = null, hI = null, hGv = null, hN = 0, hCap = 0;
  let forestCount = 0, landCount = 0, forestG = 1;
  let fxBudget = 0;

  function initCaches() {
    W = S.w | 0; Hh = S.h | 0; NN = W * Hh;
    cKey = S.tile;
    if (!cKey) return;
    fireList = new Int32Array(NN); fireN = 0; inFire = new Uint8Array(NN);
    lavaList = new Int32Array(NN); lavaN = 0;
    lbl = new Int32Array(NN); lblSizes = [0]; lblCount = 0; lastRelabel = -999;
    stack = new Int32Array(NN + 8);
    scr = new Int32Array(NN + 8); scrN = 0;
    pg = new Float64Array(NN); pPar = new Int32Array(NN); pStamp = new Uint32Array(NN); pGen = 0;
    if (!hK) { hCap = 16384; hK = new Float64Array(hCap); hI = new Int32Array(hCap); hGv = new Float64Array(hCap); }
    hN = 0;
    for (let i = 0; i < NN; i++) if (S.fire[i]) { inFire[i] = 1; fireList[fireN++] = i; }
    scanState(S.tick, true);
    S.landDirty = true;
  }
  function ensure() { if (cKey !== S.tile || W !== S.w || Hh !== S.h) initCaches(); }

  // ------------------------------------------------------------------ tiny helpers
  function inb(x, y) { return x >= 0 && y >= 0 && x < W && y < Hh; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function smooth(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
  function dmgUnits(x, y, d, cause) { if (typeof Units !== 'undefined') Units.damageAt(x, y, d, cause); }
  function dmgBld(x, y, d, cause) { if (typeof Buildings !== 'undefined') Buildings.damageAt(x, y, d, cause); }
  function killBld(x, y, cause) { if (typeof Buildings !== 'undefined') Buildings.destroyAt(x, y, cause); }
  function markAround(x, y) {
    S.markDirty(x, y);
    S.markDirty(x - 1, y); S.markDirty(x + 1, y); S.markDirty(x, y - 1); S.markDirty(x, y + 1);
    S.markDirty(x - 1, y - 1); S.markDirty(x + 1, y - 1); S.markDirty(x - 1, y + 1); S.markDirty(x + 1, y + 1);
  }
  function nearWater(i, x, y) {
    const tile = S.tile;
    return (x > 0 && ISWATER[tile[i - 1]] === 1) || (x < W - 1 && ISWATER[tile[i + 1]] === 1) ||
           (y > 0 && ISWATER[tile[i - W]] === 1) || (y < Hh - 1 && ISWATER[tile[i + W]] === 1);
  }

  // ====================================================================================================
  //  TERRAIN GENERATION
  // ====================================================================================================
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeNoise(seed) {
    const s0 = (Math.imul(seed | 0, 0x9E3779B1) ^ 0x7F4A7C15) | 0;
    const GX = new Float32Array([1, -1, 0, 0, 0.70710678, -0.70710678, 0.70710678, -0.70710678]);
    const GY = new Float32Array([0, 0, 1, -1, 0.70710678, 0.70710678, -0.70710678, -0.70710678]);
    function hash(xi, yi, salt) {
      let h = (Math.imul(xi, 0x27D4EB2D) ^ Math.imul(yi, 0x165667B1) ^ Math.imul(salt + 1, 0x9E3779B1) ^ s0) | 0;
      h = Math.imul(h ^ (h >>> 15), 0x85EBCA6B);
      h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
      return (h ^ (h >>> 16)) & 7;
    }
    // gradient noise, roughly [-1, 1]
    function n2(x, y, salt) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
      const v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
      let g = hash(xi, yi, salt);
      const a = GX[g] * fx + GY[g] * fy;
      g = hash(xi + 1, yi, salt);
      const b = GX[g] * (fx - 1) + GY[g] * fy;
      g = hash(xi, yi + 1, salt);
      const c = GX[g] * fx + GY[g] * (fy - 1);
      g = hash(xi + 1, yi + 1, salt);
      const d = GX[g] * (fx - 1) + GY[g] * (fy - 1);
      const ab = a + u * (b - a), cd = c + u * (d - c);
      return (ab + v * (cd - ab)) * 1.4;
    }
    function fbm(x, y, oct, salt) {
      let sum = 0, amp = 1, norm = 0, f = 1;
      for (let o = 0; o < oct; o++) {
        sum += amp * n2(x * f + o * 31.7, y * f - o * 17.3, salt + o * 7);
        norm += amp; amp *= 0.5; f *= 2.02;
      }
      return sum / norm;
    }
    return { n2, fbm };
  }

  /** two-pass chamfer distance (orthogonal 1, diagonal 1.414) from tiles where src[i] !== 0 */
  function chamfer(src, w, h, out) {
    const INF = 1e4, D = 1.41421356;
    const n = w * h;
    for (let i = 0; i < n; i++) out[i] = src[i] ? 0 : INF;
    for (let y = 0, i = 0; y < h; y++) {
      for (let x = 0; x < w; x++, i++) {
        let v = out[i];
        if (x > 0) { const a = out[i - 1] + 1; if (a < v) v = a; }
        if (y > 0) {
          let a = out[i - w] + 1; if (a < v) v = a;
          if (x > 0) { a = out[i - w - 1] + D; if (a < v) v = a; }
          if (x < w - 1) { a = out[i - w + 1] + D; if (a < v) v = a; }
        }
        out[i] = v;
      }
    }
    for (let y = h - 1; y >= 0; y--) {
      for (let x = w - 1; x >= 0; x--) {
        const i = y * w + x;
        let v = out[i];
        if (x < w - 1) { const a = out[i + 1] + 1; if (a < v) v = a; }
        if (y < h - 1) {
          let a = out[i + w] + 1; if (a < v) v = a;
          if (x < w - 1) { a = out[i + w + 1] + D; if (a < v) v = a; }
          if (x > 0) { a = out[i + w - 1] + D; if (a < v) v = a; }
        }
        out[i] = v;
      }
    }
  }

  /** 4-connected labelling of tiles with mask[i] === val. Returns {lbl, sizes, border} (index 0 unused). */
  function labelMask(mask, val, w, h, stk) {
    const n = w * h;
    const lab = new Int32Array(n);
    const sizes = [0], border = [0];
    let c = 0;
    for (let s = 0; s < n; s++) {
      if (mask[s] !== val || lab[s] !== 0) continue;
      c++;
      let sp = 0, size = 0, touches = 0;
      stk[sp++] = s; lab[s] = c;
      while (sp > 0) {
        const i = stk[--sp];
        size++;
        const y = (i / w) | 0, x = i - y * w;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) touches = 1;
        if (x > 0 && mask[i - 1] === val && lab[i - 1] === 0) { lab[i - 1] = c; stk[sp++] = i - 1; }
        if (x < w - 1 && mask[i + 1] === val && lab[i + 1] === 0) { lab[i + 1] = c; stk[sp++] = i + 1; }
        if (y > 0 && mask[i - w] === val && lab[i - w] === 0) { lab[i - w] = c; stk[sp++] = i - w; }
        if (y < h - 1 && mask[i + w] === val && lab[i + w] === 0) { lab[i + w] = c; stk[sp++] = i + w; }
      }
      sizes[c] = size; border[c] = touches;
    }
    return { lab, sizes, border, count: c };
  }

  /** value at fraction q (0..1) of the sorted values given as a histogram */
  function histQuantile(hist, bins, lo, hi, total, q) {
    const target = q * total;
    let acc = 0;
    for (let b = 0; b < bins; b++) {
      acc += hist[b];
      if (acc >= target) return lo + (hi - lo) * (b + 1) / bins;
    }
    return hi;
  }

  function genTerrain(w, h, seed) {
    const n = w * h;
    const N = makeNoise(seed);
    const gr = mulberry((seed ^ 0x5BD1E995) | 0);
    const area = n / 9216;
    const msz = Math.min(w, h);
    const tile = S.tile, elev = S.elev, res = S.res, amt = S.amt;
    const tmpStack = new Int32Array(n + 8);

    // ---------------------------------------------------------------- 1. continent / island blobs
    const landFrac = 0.385 + gr() * 0.07;
    const landTiles = landFrac * n;
    const blobs = [];
    const roll = gr();
    let nC = roll < 0.08 ? 1 : roll < 0.5 ? 2 : 3;
    if (area > 1.5) nC++;
    const shares = [];
    let shareSum = 0;
    for (let k = 0; k < nC; k++) { const s = (k === 0 ? 0.85 : 0.5) + gr() * 0.5; shares.push(s); shareSum += s; }
    const conts = [];
    for (let k = 0; k < nC; k++) {
      const rad = Math.sqrt((shares[k] / shareSum) * 0.9 * landTiles / Math.PI) * 1.3;
      let bx = 0, by = 0, bestScore = -1;
      for (let tries = 0; tries < 60; tries++) {
        const cx = msz * 0.2 + gr() * (w - msz * 0.4), cy = msz * 0.2 + gr() * (h - msz * 0.4);
        let mind = 1e9;
        for (let j = 0; j < conts.length; j++) {
          const d = Math.hypot(cx - conts[j].x, cy - conts[j].y) / (rad + conts[j].r);
          if (d < mind) mind = d;
        }
        if (mind > bestScore) { bestScore = mind; bx = cx; by = cy; }
        if (mind > 0.9) break;
      }
      const aspect = 1 + gr() * 0.5, ang = gr() * Math.PI;
      conts.push({ x: bx, y: by, r: rad });
      blobs.push({ x: bx, y: by, rx: rad * Math.sqrt(aspect), ry: rad / Math.sqrt(aspect), c: Math.cos(ang), s: Math.sin(ang) });
    }
    const nI = 3 + Math.floor(gr() * 4 * Math.max(1, area * 0.8));
    for (let k = 0; k < nI; k++) {
      const rad = (2.6 + gr() * 4.6) * 1.35;
      let placed = false;
      for (let tries = 0; tries < 30 && !placed; tries++) {
        const cx = 8 + gr() * (w - 16), cy = 8 + gr() * (h - 16);
        let ok = true;
        for (let j = 0; j < conts.length; j++) if (Math.hypot(cx - conts[j].x, cy - conts[j].y) < conts[j].r * 0.95 + rad * 0.9) { ok = false; break; }
        if (!ok) continue;
        placed = true;
        blobs.push({ x: cx, y: cy, rx: rad, ry: rad * (0.8 + gr() * 0.4), c: 1, s: 0 });
      }
    }

    // ---------------------------------------------------------------- 2. height field
    const Hf = new Float32Array(n), Rg = new Float32Array(n);
    let hmin = 1e9, hmax = -1e9;
    const WA = 9;
    for (let y = 0, i = 0; y < h; y++) {
      for (let x = 0; x < w; x++, i++) {
        const wx = x + WA * N.fbm(x * 0.035, y * 0.035, 3, 101);
        const wy = y + WA * N.fbm(x * 0.035 + 50, y * 0.035 + 50, 3, 202);
        const base = N.fbm(wx * 0.04, wy * 0.04, 5, 1);                // ~[-1,1]
        let inv = 1;
        for (let k = 0; k < blobs.length; k++) {
          const b = blobs[k];
          const dx = wx - b.x, dy = wy - b.y;
          const u = (dx * b.c + dy * b.s) / b.rx, v = (-dx * b.s + dy * b.c) / b.ry;
          const d2 = u * u + v * v;
          if (d2 < 1) { const m = 1 - d2; inv *= 1 - m * m * (3 - 2 * m); }
        }
        const mask = 1 - inv;
        const bd = Math.min(x, y, w - 1 - x, h - 1 - y);
        const pull = 1 - smooth(1.5, 0.2 * msz, bd);          // wide soft pull towards the sea at the map border
        const v = mask + base * 0.7 - 1.0 * pull;
        Hf[i] = v;
        if (v < hmin) hmin = v;
        if (v > hmax) hmax = v;
        const rr = 1 - Math.abs(N.fbm(wx * 0.05, wy * 0.05, 3, 33)) * 2.4;
        Rg[i] = rr > 0 ? rr * rr : 0;
      }
    }

    // ---------------------------------------------------------------- 3. sea level by percentile
    const BINS = 2048;
    const hist = new Int32Array(BINS);
    const span = hmax - hmin + 1e-6;
    for (let i = 0; i < n; i++) hist[Math.min(BINS - 1, ((Hf[i] - hmin) / span * BINS) | 0)]++;
    const sea = histQuantile(hist, BINS, hmin, hmax, n, 1 - landFrac);
    const land = new Uint8Array(n);
    for (let i = 0; i < n; i++) land[i] = Hf[i] > sea ? 1 : 0;
    // hard border
    for (let x = 0; x < w; x++) for (let k = 0; k < 2; k++) { land[k * w + x] = 0; land[(h - 1 - k) * w + x] = 0; }
    for (let y = 0; y < h; y++) for (let k = 0; k < 2; k++) { land[y * w + k] = 0; land[y * w + w - 1 - k] = 0; }

    // ---------------------------------------------------------------- 4. clean coast: majority smoothing, specks, pockets
    const tmp = new Uint8Array(n);
    for (let pass = 0; pass < 2; pass++) {
      tmp.set(land);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          const c4 = land[i - 1] + land[i + 1] + land[i - w] + land[i + w];
          if (land[i] && c4 <= 1) tmp[i] = 0;
          else if (!land[i] && c4 >= 3) tmp[i] = 1;
        }
      }
      land.set(tmp);
    }
    {
      const L = labelMask(land, 1, w, h, tmpStack);
      for (let i = 0; i < n; i++) if (land[i] && L.sizes[L.lab[i]] < 8) land[i] = 0;
      const Wt = labelMask(land, 0, w, h, tmpStack);
      for (let i = 0; i < n; i++) if (!land[i] && !Wt.border[Wt.lab[i]] && Wt.sizes[Wt.lab[i]] < 4) land[i] = 1;
    }

    // ---------------------------------------------------------------- 5. distance fields
    const dLand = new Float32Array(n), dWater = new Float32Array(n);
    const waterSrc = new Uint8Array(n);
    for (let i = 0; i < n; i++) waterSrc[i] = land[i] ? 0 : 1;
    chamfer(land, w, h, dLand);          // distance from land (0 on land)
    chamfer(waterSrc, w, h, dWater);     // distance from water (0 on water)

    // ---------------------------------------------------------------- 6. water elevation (continuous: shallow ring ~2-3 tiles)
    function waterElev(dd, jitter) {
      dd += jitter;
      if (dd < 1) dd = 1;
      if (dd <= 2.75) return 99 - (dd - 1) * 16;              // 99 .. 71
      const e = 70.5 - (dd - 2.75) * 5.5;                      // deep, gets deeper offshore
      return e < 6 ? 6 : e;
    }
    // ---------------------------------------------------------------- 7. land elevation by quantiles of a "relief" value
    let landN = 0, hLandMax = -1e9;
    for (let i = 0; i < n; i++) if (land[i]) { landN++; if (Hf[i] > hLandMax) hLandMax = Hf[i]; }
    const Lv = new Float32Array(n);
    const LB = 1024;
    const lh = new Int32Array(LB);
    for (let i = 0; i < n; i++) {
      if (!land[i]) continue;
      const hn = clamp((Hf[i] - sea) / (hLandMax - sea + 1e-6), 0, 1);
      const v = hn * 0.58 + 0.5 * Rg[i] * smooth(0.12, 0.5, hn);
      Lv[i] = v;
      lh[Math.min(LB - 1, (v / 1.1 * LB) | 0)]++;
    }
    const sandF = 0.035;
    const snowF = 0.012 + gr() * 0.02;
    const mountF = 0.05 + gr() * 0.045;
    const hillF = 0.11 + gr() * 0.06;
    const r1 = sandF, r4 = 1 - snowF, r3 = r4 - mountF, r2 = r3 - hillF;
    const cdf = new Float32Array(LB);
    {
      let acc = 0;
      for (let b = 0; b < LB; b++) { cdf[b] = (acc + lh[b] * 0.5) / Math.max(1, landN); acc += lh[b]; }
    }
    function bandElev(r) {
      if (r < r1) return 100 + 11.9 * (r / r1);
      if (r < r2) return 112 + 47.8 * ((r - r1) / (r2 - r1));
      if (r < r3) return 160 + 31.8 * ((r - r2) / (r3 - r2));
      if (r < r4) return 192 + 35.8 * ((r - r3) / (r4 - r3));
      return 228 + 26 * ((r - r4) / (1 - r4));
    }
    for (let y = 0, i = 0; y < h; y++) {
      for (let x = 0; x < w; x++, i++) {
        if (land[i]) {
          const r = cdf[Math.min(LB - 1, (Lv[i] / 1.1 * LB) | 0)];
          let e = bandElev(r);
          const dw = dWater[i];
          const nb = N.n2(x * 0.31, y * 0.31, 77);
          if (dw <= 1.5) {                                   // coastal ring: beach unless rocky
            if (e < 150 && nb > -0.3) e = 100 + (nb + 1) * 5.4;
            else if (e < 112) e = 112 + (e - 100);
          } else if (dw <= 2.1 && e < 128 && N.n2(x * 0.17, y * 0.17, 79) > 0.45) {
            e = 101 + (nb + 1) * 4.5;                         // occasionally wider beach
          } else if (e < 112) {
            e = 112 + (e - 100) * 0.9 + 1;                    // no inland sand
          }
          // small texture noise within the band
          const t0 = Tiles.fromElev(e | 0);
          const ne = e + N.n2(x * 0.5, y * 0.5, 55) * 2.5;
          const d0 = defs[t0];
          e = clamp(ne, d0.lo + 0.5, d0.hi - 0.5);
          elev[i] = clamp(e, 0, 255) | 0;
        } else {
          elev[i] = clamp(waterElev(dLand[i], N.n2(x * 0.22, y * 0.22, 91) * 0.75), 4, 99) | 0;
        }
        tile[i] = Tiles.fromElev(elev[i]);
      }
    }

    // ---------------------------------------------------------------- 8. lakes
    const nLakes = Math.floor(gr() * (3.2 + area));
    for (let k = 0; k < nLakes; k++) {
      let lx = -1, ly = -1;
      for (let tries = 0; tries < 60; tries++) {
        const x = 6 + Math.floor(gr() * (w - 12)), y = 6 + Math.floor(gr() * (h - 12));
        const i = y * w + x;
        if (tile[i] === T.GRASS && dWater[i] >= 7) { lx = x; ly = y; break; }
      }
      if (lx < 0) continue;
      const rad = 1.7 + gr() * 1.8;
      const R2 = Math.ceil(rad + 2);
      for (let y = ly - R2; y <= ly + R2; y++) {
        for (let x = lx - R2; x <= lx + R2; x++) {
          if (x < 1 || y < 1 || x >= w - 1 || y >= h - 1) continue;
          const i = y * w + x;
          const tt = tile[i];
          if (!ISLANDT[tt] || tt === T.MOUNTAIN || tt === T.SNOW) continue;
          const d = Math.hypot(x - lx, y - ly) + N.n2(x * 0.4, y * 0.4, 123) * 0.9;
          if (d <= rad) {
            const deep = rad >= 2.8 && d < rad - 1.2;
            elev[i] = deep ? 60 - (rad - d) * 2 : 84 + (d / rad) * 12;
            tile[i] = deep ? T.DEEP : T.SHALLOW;
          }
        }
      }
    }
    // beaches around lakes
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        if (tile[i] !== T.GRASS || land[i] === 0) continue;
        if (ISWATER[tile[i - 1]] || ISWATER[tile[i + 1]] || ISWATER[tile[i - w]] || ISWATER[tile[i + w]]) {
          if (dWater[i] > 1.01 && N.n2(x * 0.4, y * 0.4, 130) > -0.2) { elev[i] = 101 + ((N.n2(x * 0.7, y * 0.7, 131) + 1) * 5) | 0; tile[i] = T.SAND; }
        }
      }
    }
    // refresh water distance after lakes
    for (let i = 0; i < n; i++) waterSrc[i] = ISWATER[tile[i]] ? 1 : 0;
    chamfer(waterSrc, w, h, dWater);

    // ---------------------------------------------------------------- 9. forests (moisture noise, clumped)
    let grassN = 0, landCnt = 0;
    const Mo = new Float32Array(n);
    const MB = 512;
    const mh = new Int32Array(MB);
    for (let y = 0, i = 0; y < h; y++) {
      for (let x = 0; x < w; x++, i++) {
        const t = tile[i];
        if (ISLANDT[t]) landCnt++;
        if (t !== T.GRASS) continue;
        grassN++;
        let m = 0.5 + 0.5 * (0.7 * N.fbm(x * 0.052 + 11, y * 0.052 + 7, 4, 301) + 0.3 * N.fbm(x * 0.13, y * 0.13, 2, 311));
        m += 0.07 * (1 - clamp(dWater[i] / 9, 0, 1));          // a bit more forest near water
        m = clamp(m, 0, 1.2);
        Mo[i] = m;
        mh[Math.min(MB - 1, (m / 1.2 * MB) | 0)]++;
      }
    }
    const forestFrac = 0.145 + gr() * 0.05;
    let fTarget = Math.round(landCnt * forestFrac);
    if (fTarget > grassN * 0.5) fTarget = Math.floor(grassN * 0.5);
    const thr = grassN > 0 ? histQuantile(mh, MB, 0, 1.2, grassN, 1 - fTarget / Math.max(1, grassN)) : 2;
    for (let i = 0; i < n; i++) if (tile[i] === T.GRASS && Mo[i] > thr) tile[i] = T.FOREST;
    // smoothing: lone forest tiles vanish, 3-sided grass holes fill
    tmp.fill(0);
    for (let i = 0; i < n; i++) tmp[i] = tile[i] === T.FOREST ? 1 : 0;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        const c4 = tmp[i - 1] + tmp[i + 1] + tmp[i - w] + tmp[i + w];
        if (tile[i] === T.FOREST && c4 === 0) tile[i] = T.GRASS;
        else if (tile[i] === T.GRASS && c4 >= 3) tile[i] = T.FOREST;
      }
    }
    for (let i = 0; i < n; i++) if (tile[i] === T.FOREST) { amt[i] = 80 + Math.floor(gr() * 121); }

    // ---------------------------------------------------------------- 10. resources
    // forest proximity (within 2 tiles) and mountain proximity (within 2 tiles), cheap box scan
    const nearForest = new Uint8Array(n), nearMtn = new Uint8Array(n);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const t = tile[y * w + x];
        if (t !== T.FOREST && t !== T.MOUNTAIN && t !== T.SNOW) continue;
        const y0 = Math.max(0, y - 2), y1 = Math.min(h - 1, y + 2), x0 = Math.max(0, x - 2), x1 = Math.min(w - 1, x + 2);
        for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
          if (t === T.FOREST) nearForest[yy * w + xx] = 1; else nearMtn[yy * w + xx] = 1;
        }
      }
    }
    const hillTiles = [], mtnTiles = [];
    for (let y = 0, i = 0; y < h; y++) {
      for (let x = 0; x < w; x++, i++) {
        const t = tile[i];
        if (res[i]) continue;
        if (t === T.GRASS) {
          const nf = nearForest[i], wd = dWater[i] <= 3.1;
          let p = 0.010 + (nf ? 0.050 : 0);                         // lone trees: more at forest edges
          const q = gr();
          if (q < p) { res[i] = RES.TREE; amt[i] = 10 + Math.floor(gr() * 51); continue; }
          const pb = 0.008 + (nf ? 0.022 : 0) + (wd ? 0.016 : 0);   // berries near forest / water
          if (q < p + pb) { res[i] = RES.BERRY; amt[i] = 30 + Math.floor(gr() * 91); continue; }
          if (nearMtn[i] && q < p + pb + 0.012) { res[i] = RES.ROCK; amt[i] = 40 + Math.floor(gr() * 61); continue; }
          if (q < p + pb + 0.012 + 0.002) { res[i] = RES.ROCK; amt[i] = 30 + Math.floor(gr() * 51); }
        } else if (t === T.HILL || t === T.MOUNTAIN) {
          (t === T.HILL ? hillTiles : mtnTiles).push(i);
          const vein = N.fbm(x * 0.33 + 5, y * 0.33 + 9, 2, 401);          // ore veins: small clusters
          const vein2 = N.fbm(x * 0.29 + 40, y * 0.29 + 3, 2, 431);
          const q = gr();
          if (vein > 0.30 && q < 0.7) { res[i] = RES.ROCK; amt[i] = 60 + Math.floor(gr() * 141); }
          else if (vein2 > 0.36 && (nearMtn[i] || t === T.MOUNTAIN) && q < 0.75) { res[i] = RES.IRON; amt[i] = 50 + Math.floor(gr() * 111); }
          else if (t === T.MOUNTAIN && q > 0.985) { res[i] = RES.GOLD; amt[i] = 25 + Math.floor(gr() * 56); }
          else if (q < 0.025) { res[i] = RES.ROCK; amt[i] = 50 + Math.floor(gr() * 100); }
        }
      }
    }
    // guarantee a few rare ores whenever the terrain can hold them
    function sprinkle(list, kind, want, lo, span) {
      let have = 0;
      for (let k = 0; k < list.length; k++) if (res[list[k]] === kind) have++;
      let guard = 0;
      while (have < want && list.length && guard++ < 400) {
        const i = list[Math.floor(gr() * list.length)];
        if (res[i] === RES.GOLD || res[i] === RES.IRON) continue;
        res[i] = kind; amt[i] = lo + Math.floor(gr() * span); have++;
      }
    }
    const ores = mtnTiles.length ? mtnTiles : hillTiles;
    if (ores.length >= 6) sprinkle(ores, RES.GOLD, Math.max(2, Math.min(6, Math.round(ores.length * 0.012))), 25, 56);
    if (hillTiles.length + mtnTiles.length >= 10) sprinkle(hillTiles.length ? hillTiles : mtnTiles, RES.IRON, 4, 50, 111);
  }

  function generate(opts) {
    opts = opts || {};
    const w = (opts.w | 0) || Const.DEFAULT_W, h = (opts.h | 0) || Const.DEFAULT_H;
    const seed = (opts.seed === undefined || opts.seed === null) ? (S.seed || 1) : opts.seed;
    S.reset(w, h, seed);
    genTerrain(S.w, S.h, S.seed);
    S.allDirty = true; S.landDirty = true;
    initCaches();
    return S;
  }

  // ====================================================================================================
  //  TILE ACCESS & MUTATION
  // ====================================================================================================
  function tileAt(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile || x < 0 || y < 0 || x >= S.w || y >= S.h) return T.DEEP;
    return S.tile[y * S.w + x];
  }
  function walkable(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile || x < 0 || y < 0 || x >= S.w || y >= S.h) return false;
    return WALK[S.tile[y * S.w + x]] === 1;
  }
  function inBounds(x, y) { x = Math.floor(x); y = Math.floor(y); return x >= 0 && y >= 0 && x < S.w && y < S.h; }

  /** flammability of the thing standing on tile i (0 = cannot burn) */
  function bldFlam(id) {
    if (typeof Buildings === 'undefined') return 0.8;
    const b = Buildings.get(id);
    if (!b) return 0.8;
    if (typeof b.flam === 'number') return b.flam;
    const d = Buildings.defs && Buildings.defs[b.type];
    return d && typeof d.flam === 'number' ? d.flam : 0.8;
  }
  function flamIdx(i) {
    let f = FLAM[S.tile[i]];
    const rk = S.res[i];
    if (rk === RES.TREE) { if (f < 0.7) f = 0.7; }
    else if (rk === RES.BERRY) { if (f < 0.35) f = 0.35; }
    const b = S.bld[i];
    if (b) { const bf = bldFlam(b); if (bf > f) f = bf; }
    return f;
  }

  /** core tile mutation used by setTile / brush / growth / fire. i = y*w+x. elev undefined => keep if in band else mid. */
  function put(i, x, y, t, elev, keepRes) {
    const tile = S.tile;
    const old = tile[i];
    const oldE = S.elev[i];
    let e;
    if (elev !== undefined && elev !== null) e = elev < 0 ? 0 : elev > 255 ? 255 : elev | 0;
    else { const d = defs[t]; e = (oldE >= d.lo && oldE < d.hi) ? oldE : d.mid; }
    if (old === t && e === oldE) return false;
    tile[i] = t; S.elev[i] = e;
    if (!keepRes) {
      if (t === T.FOREST) {
        if (old !== T.FOREST) { S.res[i] = 0; S.amt[i] = 80 + R.i(121); }
      } else {
        const rk = S.res[i];
        if (rk && RES_OK[t * 8 + rk] === 0) { S.res[i] = 0; S.amt[i] = 0; }
        else if (!rk) S.amt[i] = 0;
      }
    }
    if (WALK[old] !== WALK[t] || ISWATER[old] !== ISWATER[t]) S.landDirty = true;
    if (S.fire[i] && flamIdx(i) <= 0) S.fire[i] = 0;
    if (S.bld[i] && BUILD[t] === 0) killBld(x, y, 'terrain');
    if (t === T.LAVA) dmgUnits(x, y, 40, 'lava');
    markAround(x, y);
    if (old !== t) Bus.emit('tileChanged', x, y, old, t);
    return true;
  }

  function setTile(x, y, t, opts) {
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile || x < 0 || y < 0 || x >= S.w || y >= S.h) return false;
    if (!(t >= 0 && t < NT)) return false;
    ensure();
    return put(y * W + x, x, y, t, opts ? opts.elev : undefined, !!(opts && opts.keepRes));
  }

  // ---------------------------------------------------------------- brushes
  const TOOL = { raise: 1, lower: 2, grass: 3, sand: 4, forest: 5, hill: 6, mountain: 7, snow: 8, lava: 9 };

  /** returns the number of tiles changed */
  function brush(toolId, cx, cy, r) {
    if (!S.tile) return 0;
    const tool = TOOL[toolId];
    if (!tool) return 0;
    ensure();
    cx = Math.floor(cx); cy = Math.floor(cy);
    if (cx !== cx || cy !== cy) return 0;
    r = Math.round(r);
    if (!(r >= 1)) r = 1;
    if (r > 16) r = 16;
    const rr = r + 0.5, rr2 = rr * rr, core = rr * 0.7, inv = 1 / (rr - core);
    const x0 = Math.max(0, cx - r), x1 = Math.min(W - 1, cx + r), y0 = Math.max(0, cy - r), y1 = Math.min(Hh - 1, cy + r);
    const tile = S.tile;
    let changed = 0;
    scrN = 0;
    const lift = tool === 1;
    for (let y = y0; y <= y1; y++) {
      const dy = y - cy;
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx;
        const d2 = dx * dx + dy * dy;
        if (d2 > rr2) continue;
        const d = Math.sqrt(d2);
        const fall = d <= core ? 1 : (rr - d) * inv;
        const i = y * W + x;
        const t0 = tile[i];
        if (tool <= 2) {
          // ---- raise / lower: elevation change, retype by band
          const s = fall * fall * (3 - 2 * fall);
          let delta = ((8 + R.f() * 20) * s + 0.5) | 0;
          if (delta < 1) { if (s < 0.12) continue; delta = 1; }
          if (t0 === T.LAVA) { if (put(i, x, y, lift ? T.MOUNTAIN : T.HILL, lift ? 210 : 176)) changed++; continue; }
          const e = S.elev[i];
          let ne = lift ? e + delta : e - delta;
          if (ne < 0) ne = 0; else if (ne > 255) ne = 255;
          if (ne === e) continue;
          let nt = Tiles.fromElev(ne);
          if (t0 === T.FOREST && ne >= 112 && ne < 160) nt = T.FOREST;
          if (put(i, x, y, nt, ne)) changed++;
          continue;
        }
        // ---- painting tools
        if (fall < 1 && R.f() > fall) continue;      // dithered soft rim
        let nt;
        switch (tool) {
          case 3: nt = T.GRASS; break;
          case 4: nt = T.SAND; break;
          case 5: nt = T.FOREST; break;
          case 6: nt = T.HILL; break;
          case 7: nt = T.MOUNTAIN; break;
          case 8: nt = T.SNOW; break;
          default: nt = T.LAVA; break;
        }
        if (tool === 5) {
          if (S.bld[i]) continue;
          if (t0 === T.FOREST) {
            if (S.amt[i] < 100) { S.amt[i] = 100 + R.i(100); S.markDirty(x, y); changed++; }
            continue;
          }
        } else if (tool === 7 && r >= 3 && d > rr * 0.55) {
          if (t0 === T.HILL || t0 === T.MOUNTAIN || t0 === T.SNOW || t0 === T.LAVA) continue;
          nt = T.HILL;                                // soft foothills around a painted mountain
        }
        if (t0 === nt) continue;
        if (ISWATER[t0] === 1 && ISWATER[nt] === 0 && nt !== T.LAVA) scr[scrN++] = i;
        if (put(i, x, y, nt)) changed++;
      }
    }
    // land painted over deep water gets a shallow shelf so it does not stand on a cliff
    for (let k = 0; k < scrN; k++) {
      const i = scr[k];
      const y = (i / W) | 0, x = i - y * W;
      for (let ddy = -1; ddy <= 1; ddy++) {
        const yy = y + ddy;
        if (yy < 0 || yy >= Hh) continue;
        for (let ddx = -1; ddx <= 1; ddx++) {
          const xx = x + ddx;
          if (xx < 0 || xx >= W) continue;
          const j = yy * W + xx;
          if (tile[j] === T.DEEP && put(j, xx, yy, T.SHALLOW, 84)) changed++;

  }

  // ====================================================================================================
  //  QUERIES
  // ====================================================================================================
  function costTabFor(race) {
    race = race | 0;
    if (race < 0 || race >= Const.RACE_COUNT) race = Const.RACE_COUNT;
    let tb = costTabs[race];
    if (!tb) {
      tb = new Float32Array(NT);
      const rc = Races.get(race);
      const terr = rc && rc.terrain;
      for (let t = 0; t < NT; t++) {
        let m = 1;
        if (terr && terr[t] !== undefined) m = terr[t];
        tb[t] = SPEED[t] * m;
      }
      costTabs[race] = tb;
    }
    return tb;
  }
  const costTabs = [];

  function moveCost(x, y, race) {
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile || x < 0 || y < 0 || x >= S.w || y >= S.h) return 0;
    return costTabFor(race)[S.tile[y * S.w + x]];
  }

  function isBuildable(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile || x < 0 || y < 0 || x >= S.w || y >= S.h) return false;
    const i = y * S.w + x;
    return BUILD[S.tile[i]] === 1 && S.bld[i] === 0 && S.fire[i] === 0 && S.res[i] === 0;
  }

  function resAt(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile || x < 0 || y < 0 || x >= S.w || y >= S.h) return { kind: RES.NONE, amt: 0 };
    const i = y * S.w + x;
    if (S.tile[i] === T.FOREST) return { kind: RES.TREE, amt: S.amt[i] };
    const k = S.res[i];
    return k ? { kind: k, amt: S.amt[i] } : { kind: RES.NONE, amt: 0 };
  }

  function fishSpot(i, x, y) {
    const t = S.tile[i];
    if (WALK[t] === 0 || ISWATER[t] === 1) return false;
    const tile = S.tile;
    return (x > 0 && tile[i - 1] === T.SHALLOW) || (x < W - 1 && tile[i + 1] === T.SHALLOW) ||
           (y > 0 && tile[i - W] === T.SHALLOW) || (y < Hh - 1 && tile[i + W] === T.SHALLOW);
  }

  // ring search state (module-level so a search allocates nothing)
  let qBest = -1, qD = 0, qCx = 0, qCy = 0, qMode = 0, qA = 0, qPred = null;
  function qMatch(i, x, y) {
    if (qMode === 0) return S.tile[i] === qA;
    switch (qA) {
      case RES.TREE: return S.tile[i] === T.FOREST || (S.res[i] === RES.TREE && S.amt[i] > 0);
      case RES.ROCK: case RES.IRON: case RES.GOLD: return S.res[i] === qA && S.amt[i] > 0;
      case RES.BERRY: return S.res[i] === RES.BERRY && S.amt[i] >= 5;
      case RES.FISH: return fishSpot(i, x, y);
    }
    return false;
  }
  function qCell(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= Hh) return;

  }
  function ringSearch(cx, cy, maxR, mode, a, pred) {
    ensure();
    cx = Math.floor(cx); cy = Math.floor(cy);
    if (!S.tile || cx !== cx || cy !== cy) return null;
    if (!(maxR > 0)) maxR = 24;
    if (maxR > W + Hh) maxR = W + Hh;
    qBest = -1; qD = 1e12; qCx = cx; qCy = cy; qMode = mode; qA = a; qPred = typeof pred === 'function' ? pred : null;
    for (let r = 0; r <= maxR; r++) {

  function findNearestRes(x, y, kind, maxR, pred) { return ringSearch(x, y, maxR, 1, kind, pred); }
  function nearestTile(x, y, tileId, maxR) { return ringSearch(x, y, maxR || 32, 0, tileId, null); }

  /** nearest walkable tile (any kind of walkable, incl. shallows) -> [x,y] | null */
  function nearestWalkable(x, y, maxR) {
    ensure();
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile) return null;
    if (inb(x, y) && WALK[S.tile[y * W + x]]) return [x, y];
    let best = -1, bd = 1e12;
    maxR = maxR > 0 ? maxR : 12;
    for (let r = 1; r <= maxR; r++) {
      if (best >= 0 && r * r > bd) break;
      for (let yy = y - r; yy <= y + r; yy++) {
        if (yy < 0 || yy >= Hh) continue;
        const edge = (yy === y - r || yy === y + r);
        for (let xx = x - r; xx <= x + r; xx += (edge ? 1 : 2 * r)) {
          if (xx < 0 || xx >= W) continue;
          const i = yy * W + xx;
          if (!WALK[S.tile[i]]) continue;

          if (d < bd) { bd = d; best = i; }
        }

  function randomLand(pred, tries) {
    ensure();
    if (!S.tile) return null;
    const explicit = tries > 0;
    const n = explicit ? tries : 80;
    for (let k = 0; k < n; k++) {
      const x = R.i(W), y = R.i(Hh);
      const t = S.tile[y * W + x];
      if (WALK[t] === 1 && ISWATER[t] === 0 && (!pred || pred(x, y))) return [x, y];
    }
    if (explicit) return null;
    const start = R.i(NN);
    for (let k = 0; k < NN; k++) {
      let i = start + k; if (i >= NN) i -= NN;
      const t = S.tile[i];
      if (WALK[t] === 1 && ISWATER[t] === 0) {
        const y = (i / W) | 0, x = i - y * W;
        if (!pred || pred(x, y)) return [x, y];
      }
    }
    return null;
  }

  // ---------------------------------------------------------------- harvesting
  /** returns the amount actually taken (integer >= 0). Fractional requests are rounded stochastically. */
  function harvest(x, y, kind, amount) {
    x = Math.floor(x); y = Math.floor(y);
    amount = +amount;
    if (!S.tile || !(amount > 0) || x < 0 || y < 0 || x >= S.w || y >= S.h) return 0;
    ensure();
    const i = y * W + x;
    if (kind === RES.FISH) {
      const ok = fishSpot(i, x, y) || S.tile[i] === T.SHALLOW;
      return ok ? Math.floor(amount) + (R.f() < amount - Math.floor(amount) ? 1 : 0) : 0;
    }
    let need = Math.floor(amount);
    const fr = amount - need;
    if (fr > 0 && R.f() < fr) need++;
    if (need <= 0) return 0;

      if (kind && kind !== RES.TREE) return 0;

      const take = need < a ? need : a;
      if (a - take <= 0) put(i, x, y, T.GRASS, S.elev[i]);
      else { S.amt[i] = a - take; if ((a >> 5) !== ((a - take) >> 5)) S.markDirty(x, y); }
      return take;
    }
    const rk = S.res[i];
    if (!rk || (kind && kind !== rk)) return 0;
    const a = S.amt[i];
    const take = need < a ? need : a;
    if (take <= 0) return 0;
    const left = a - take;
    S.amt[i] = left;
    if (left <= 0) {
      if (rk !== RES.BERRY) S.res[i] = 0;          // ore / lone tree vanish; berry bushes stay and regrow
      S.markDirty(x, y);
    }
    return take;
  }

  // ====================================================================================================
  //  FIRE
  // ====================================================================================================
  function startFire(i, fl) {
    const t = S.tile[i];
    let dur;
    if (S.bld[i]) dur = 70 + R.i(30);
    else if (t === T.FOREST) dur = 38 + R.i(26);
    else if (S.res[i] === RES.TREE) dur = 22 + R.i(8);
    else if (t === T.GRASS) dur = 16 + R.i(10);
    else dur = 8 + R.i(6);
    S.fire[i] = dur;
    if (!inFire[i]) { inFire[i] = 1; fireList[fireN++] = i; }
  }

  function ignite(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (!S.tile || x < 0 || y < 0 || x >= S.w || y >= S.h) return false;
    ensure();
    const i = y * W + x;
    if (S.fire[i]) return false;
    const fl = flamIdx(i);
    if (fl <= 0) return false;
    startFire(i, fl);
    return true;
  }
  function extinguish(x, y, r) {
    if (!S.tile) return 0;
    ensure();
    x = Math.floor(x); y = Math.floor(y);
    r = r > 0 ? r : 0;
    const R2 = r * r + 0.25, ri = Math.ceil(r);

    for (let yy = Math.max(0, y - ri); yy <= Math.min(Hh - 1, y + ri); yy++) {

        const dx = xx - x, dy = yy - y;
        if (dx * dx + dy * dy > R2) continue;

    }
    return n;
  }
  function isBurning(x, y) {
    x = Math.floor(x); y = Math.floor(y);

    return S.fire[y * S.w + x] > 0;
  }

  function rainAt(rains, x, y, tick) {
    for (let k = 0; k < rains.length; k++) {
      const rn = rains[k];
      if (rn.until !== undefined && rn.until <= tick) continue;
      const dx = x + 0.5 - rn.x, dy = y + 0.5 - rn.y;
      if (dx * dx + dy * dy <= rn.r * rn.r) return true;
    }
    return false;
  }

  function burnOut(i, x, y) {
    const t = S.tile[i];
    if (t === T.FOREST) {
      put(i, x, y, T.GRASS, S.elev[i]);
      if (fxBudget > 0) { fxBudget--; Fx.add('ash', x + 0.5, y + 0.5, { ttl: 1.4 }); }
    } else {
      const rk = S.res[i];
      if (rk === RES.TREE || rk === RES.BERRY) { S.res[i] = 0; S.amt[i] = 0; S.markDirty(x, y); }
      if (fxBudget > 0 && R.f() < 0.5) { fxBudget--; Fx.add('smoke', x + 0.5, y + 0.5, { ttl: 1.0 }); }
    }
  }

  function tryCatch(j, jx, jy, tick) {
    const fire = S.fire;
    if (fire[j]) return;
    const fl = flamIdx(j);
    if (fl <= 0) return;
    const p = FIRE_SPREAD * fl;
    const rv = R.f();
    if (rv >= p) return;
    if (rv >= p * 0.45 && nearWater(j, jx, jy)) return;       // water next to the tile slows the fire
    startFire(j, fl);
  }

  function stepFire(tick) {
    const n0 = fireN;
    if (n0 === 0) return;
    const fire = S.fire, bld = S.bld;
    const rains = (S.eff && S.eff.rains && S.eff.rains.length) ? S.eff.rains : null;
    let wr = 0, fxFire = 2;
    for (let k = 0; k < n0; k++) {

      if (f === 0) { inFire[i] = 0; continue; }
      const y = (i / W) | 0, x = i - y * W;
      if (rains !== null && rainAt(rains, x, y, tick) && R.f() < 0.3) {

        continue;
      }

      }

      if (x < W - 1) tryCatch(i + 1, x + 1, y, tick);

  }

  // ====================================================================================================
  //  LAVA
  // ====================================================================================================
  function stepLava(tick) {
    if (lavaN === 0) return;
    const tile = S.tile;
    const phase = tick % 10;
    for (let k = phase; k < lavaN; k += 10) {
      const i = lavaList[k];
      if (tile[i] !== T.LAVA) continue;
      const y = (i / W) | 0, x = i - y * W;
      const l = x > 0 ? i - 1 : -1, r = x < W - 1 ? i + 1 : -1, u = y > 0 ? i - W : -1, d = y < Hh - 1 ? i + W : -1;
      const wet = (l >= 0 && ISWATER[tile[l]]) || (r >= 0 && ISWATER[tile[r]]) || (u >= 0 && ISWATER[tile[u]]) || (d >= 0 && ISWATER[tile[d]]);
      if (wet) {
        if (R.f() < 0.5) {
          put(i, x, y, T.MOUNTAIN);
          if (fxBudget > 0) { fxBudget--; Fx.add('smoke', x + 0.5, y + 0.5, { ttl: 1.3, n: 3 }); }
          continue;
        }
      } else if (R.f() < LAVA_HILL_P) {

        continue;

      for (let q = 0; q < 4; q++) {

        if (j < 0) continue;
